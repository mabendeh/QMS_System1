<title>CHG Process Mapper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed header + scrollable tab strip, single work column, side panel (bottom sheet on phones). Industrial drafting look: navy ink, steel neutrals, amber = not yet collected. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface2: #F7F9FB; --line: #D8DFE7; --ink: #14202E; --muted: #5E6B7A;
  --brand: #13315C; --brand-ink: #FFFFFF; --accent: #2F6FB0; --ok: #2F9E6E; --est: #2F6FB0; --nyc: #B9770E; --bad: #C0392B;
  --ok-bg: #E4F4EC; --est-bg: #E5EEF8; --nyc-bg: #FBF0DD; --bad-bg: #FBE6E3;
  --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; --f-mono: "IBM Plex Mono", Consolas, monospace;
  --r: 6px; --shadow: 0 1px 2px rgba(15, 30, 50, .06), 0 2px 8px rgba(15, 30, 50, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B131C; --surface: #121D29; --surface2: #172433; --line: #263547; --ink: #E6EDF5; --muted: #93A3B5;
  --brand: #8EB4E3; --brand-ink: #0B131C; --accent: #6FA8E8; --ok: #4CC48F; --est: #6FA8E8; --nyc: #E3A640; --bad: #E86A5A;
  --ok-bg: #143327; --est-bg: #15283D; --nyc-bg: #3A2A10; --bad-bg: #3D1C18; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B131C; --surface: #121D29; --surface2: #172433; --line: #263547; --ink: #E6EDF5; --muted: #93A3B5;
  --brand: #8EB4E3; --brand-ink: #0B131C; --accent: #6FA8E8; --ok: #4CC48F; --est: #6FA8E8; --nyc: #E3A640; --bad: #E86A5A;
  --ok-bg: #143327; --est-bg: #15283D; --nyc-bg: #3A2A10; --bad-bg: #3D1C18; --shadow: none; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto }
.brand b { font-size: 12px; letter-spacing: .12em; color: var(--brand) }
.brand span { font-size: 17px; font-weight: 700 }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.save { font-size: 12px; color: var(--muted) }
.demo { background: var(--nyc-bg); color: var(--nyc); font-weight: 700; font-size: 11px; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--nyc) }
nav#nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 0 }
.tab { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; color: var(--muted); font: 500 13px var(--f-body); cursor: pointer; white-space: nowrap }
.tab:hover { color: var(--ink) } .tab.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600 }
main { padding-block: 18px 80px; display: flex; flex-direction: column; gap: 16px; max-width: 1500px; margin: 0 auto }
h1 { font-size: 22px; margin: 0; text-wrap: balance } h2 { font-size: 15px; margin: 0 } h3 { font-size: 16px; margin: 4px 0 } h4 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 75ch }
.muted { color: var(--muted) } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap } .sm { font-size: 12px } .nowrap { white-space: nowrap }
.head-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between }
.head-row > div:first-child { min-width: 0; flex: 1 1 420px }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); min-width: 0 }
.card.empty { text-align: left } .card-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 10px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start }
.kpi-l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.kpi-v { font: 600 22px var(--f-mono); font-variant-numeric: tabular-nums } .kpi-v small { font: 400 12px var(--f-body); color: var(--muted); margin-left: 4px }
.kpi-v.nycv { color: var(--nyc); font-size: 18px } .kpi-n { font-size: 11px; color: var(--muted) }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap }
.chip.ok { background: var(--ok-bg); color: var(--ok) } .chip.est { background: var(--est-bg); color: var(--est) } .chip.nyc { background: var(--nyc-bg); color: var(--nyc) } .chip.bad { background: var(--bad-bg); color: var(--bad) }
.btn { font: 500 13px var(--f-body); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 12px; cursor: pointer; text-align: left }
.btn:hover { border-color: var(--accent) } .btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand) } .btn.on { background: var(--est-bg); border-color: var(--accent); color: var(--accent) }
.btn.sm { padding: 5px 9px; font-size: 12px } .btn.xs { padding: 2px 7px; font-size: 12px; margin: 1px } .btn[disabled] { opacity: .5; cursor: not-allowed }
.btn-col { display: flex; flex-direction: column; gap: 8px; align-items: stretch }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; text-align: left }
input, select, textarea { font: 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; max-width: 100% }
input[type=number] { font-family: var(--f-mono); width: 7.5em } input[type=color] { padding: 0; width: 40px; height: 28px }
input::placeholder, textarea::placeholder { color: var(--nyc); opacity: .8 }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted) } label.inl { flex-direction: row; align-items: center; gap: 6px } label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 13px }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px }
.toolbar .sp, .legend .sp { flex: 1 } .seg { display: flex; gap: 4px }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: auto; max-height: 72vh; min-height: 280px; -webkit-overflow-scrolling: touch }
.canvas svg { display: block } .canvas .fnode, .canvas .zone, .canvas .swim { touch-action: none } .canvas.drawing { cursor: crosshair } .canvas.drawing svg { touch-action: none }
.scrollx { overflow-x: auto; max-width: 100% } .scrollx.mini svg { width: 100%; height: auto }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px } .tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 2px solid var(--line); background: var(--surface2); white-space: nowrap }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top } .tbl td.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.tbl.edit td { padding: 3px 4px } .tbl.edit input:not([type=number]):not([type=checkbox]):not([type=color]) { width: 100%; min-width: 110px } .tbl textarea { width: 100%; min-width: 200px }
.tbl tr.na td { opacity: .55 } .tbl tr.selrow td { background: var(--est-bg) } .tbl tr.tot td { font-weight: 600; background: var(--surface2) } .tbl tr.overdue td { background: var(--bad-bg) }
.tbl .unit { white-space: nowrap; color: var(--muted); font-size: 12px } .tbl .ord { white-space: nowrap } td.good { color: var(--ok) } td.bad { color: var(--bad) }
.nyc-t { color: var(--nyc); font-weight: 600 }
.matrix td { font-family: var(--f-mono); font-size: 12px; text-align: right; cursor: pointer; white-space: nowrap } .matrix td:first-child { text-align: left; font-family: var(--f-body) }
.matrix .m-NYC { color: var(--nyc); background: var(--nyc-bg) } .matrix .m-EST { color: var(--est) } .matrix .m-VER { color: var(--ok); font-weight: 600 }
.bar { height: 10px; background: var(--nyc-bg); border-radius: 999px; position: relative; overflow: hidden; border: 1px solid var(--line) }
.bar span { position: absolute; left: 0; top: 0; bottom: 0 } .bar-est { background: var(--est); opacity: .55 } .bar-ver { background: var(--ok) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; align-items: center } .legend.wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin: 0 }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px } .sw.ver { background: var(--ok) } .sw.est { background: var(--est); opacity: .55 } .sw.nyc { background: var(--nyc-bg); border: 1px solid var(--nyc) }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px }
.sym { display: inline-block; width: 18px; height: 12px; border: 1.5px solid var(--brand); margin-right: 5px; vertical-align: -2px; background: var(--surface) }
.sym-start { border-radius: 8px } .sym-decision { width: 12px; transform: rotate(45deg); margin: 0 8px 0 4px } .sym-inspection { outline: 1px solid var(--brand); outline-offset: -4px }
.sym-transport { clip-path: polygon(0 0, 70% 0, 100% 50%, 70% 100%, 0 100%); background: var(--brand); border: 0 } .sym-delay { border-radius: 0 8px 8px 0 }
.sym-storage { width: 0; height: 0; border: 7px solid transparent; border-top: 11px solid var(--brand); background: none; vertical-align: -6px }
.sym-rework { border-style: dashed; border-color: var(--nyc) } .sym-scrap { border-color: var(--bad) }
.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 10px }
.mini-stats div { display: flex; flex-direction: column } .mini-stats b { font: 600 20px var(--f-mono) } .mini-stats b.bad { color: var(--bad) } .mini-stats span { font-size: 12px; color: var(--muted) }
.wastes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 8px }
.waste { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column } .waste b { font: 600 20px var(--f-mono) } .waste span { font-weight: 600 } .waste small { color: var(--muted); font-size: 11px }
.sugg { padding-left: 18px; display: flex; flex-direction: column; gap: 8px; margin: 0 }
.hbar { display: grid; grid-template-columns: minmax(130px, 1fr) 2fr auto; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px }
.hb-t { background: var(--surface2); height: 14px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line) } .hb-t span { display: block; height: 100% } .hb-v { font-family: var(--f-mono); color: var(--muted) }
.actype { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; color: #fff; font-style: normal; font-weight: 700; font-size: 10px; margin-right: 6px }
.type-O, .type-bg-O { background: #2F6FB0; } .type-T, .type-bg-T { background: #C2410C } .type-I, .type-bg-I { background: #2F9E6E } .type-D, .type-bg-D { background: #B9770E } .type-S, .type-bg-S { background: #6E59A5 }
select.type-O, select.type-T, select.type-I, select.type-D, select.type-S { background: var(--surface); color: var(--ink) }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px } .checks label { flex-direction: row; align-items: flex-start; gap: 10px; color: var(--ink); font-size: 13px } .checks input { margin-top: 3px }
.row-fields { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 8px 0 } .row-fields .grow { flex: 1 1 260px } .row-fields .grow input { width: 100% }
.file { margin-bottom: 10px } .file input { margin-top: 4px }
aside#panel { position: fixed; z-index: 25; right: max(12px, env(safe-area-inset-right, 0px)); top: 128px; bottom: 16px; width: min(400px, calc(100vw - 24px)); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: 0 8px 30px rgba(10, 20, 35, .18); display: flex; flex-direction: column; gap: 8px }
aside#panel .close { align-self: flex-end } aside#panel textarea, aside#panel input:not([type=checkbox]):not([type=number]), aside#panel select { width: 100% }
.pfields { display: flex; flex-direction: column; gap: 10px } .pf { border-bottom: 1px dashed var(--line); padding-bottom: 8px } .pf-row { display: flex; gap: 6px; align-items: center } .pf-row select { width: auto !important } .pf .src { margin-top: 4px; font-size: 12px } .pf details { font-size: 12px; color: var(--muted) }
@media (min-width: 1200px) { body.panel-open main { margin-right: 420px } }
@media (max-width: 700px) { aside#panel { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); max-height: 62vh } h1 { font-size: 19px } .kpi-v { font-size: 19px } }
.toast { position: fixed; z-index: 40; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; transition: transform .2s; max-width: calc(100vw - 32px) }
.toast.show { transform: translate(-50%, 0) } .toast.warn { background: var(--nyc); color: #1b1203 }
@media (prefers-reduced-motion: reduce) { .toast { transition: none } }
</style>
<header class="top">
  <div class="wrap top-row">
    <div class="brand"><b data-logo-placeholder="true">C.H. GUENTHER &amp; SON · DUNCANVILLE</b><span>Process Mapping &amp; CI System</span></div>
    <div class="ctrls">
      <span class="demo" id="demoBadge" hidden>DEMO DATA</span>
      <label class="inl" for="lineSel"><span class="sr">Line</span><select id="lineSel" aria-label="Production line"></select></label>
      <select id="stateSel" aria-label="Map state"></select>
      <span class="save" id="saveState">Loading…</span>
    </div>
  </div>
  <nav id="nav" class="wrap" aria-label="Views"></nav>
</header>
<main id="view" class="wrap" aria-live="polite"></main>
<aside id="panel" hidden aria-label="Details"></aside>
<div id="toast" class="toast" role="status"></div>
<script>
/* =====================================================================
   CHG Process Mapper — core: constants, data model, templates, demo data
   Every measurement is a field {v, s, src}:
     v   = number or null (null = Not Yet Collected)
     s   = 'VER' (verified on the floor / system of record) | 'EST' (estimate / assumption)
     src = free-text data source (who, when, how)
   ===================================================================== */
'use strict';

const APP_VERSION = '0.9.0-prototype';
const NYC = 'Not Yet Collected';
const STATUS = { NYC: 'Not Yet Collected', EST: 'Estimate', VER: 'Verified' };
const DEMO_SRC = 'DEMO — illustrative value, not plant data';

const DEPTS = ['Production', 'Quality', 'Maintenance', 'Sanitation', 'Warehouse', 'Planning', 'Supervisors'];
const DEPT_COLORS = { Production: '#2F6FB0', Quality: '#2F9E6E', Maintenance: '#B9770E', Sanitation: '#6E59A5', Warehouse: '#5B7FA6', Planning: '#8A5A44', Supervisors: '#13315C' };
const APPLIC = ['To verify', 'Confirmed', 'Not applicable'];
const VACLASS = { VA: 'Value-added', NNVA: 'Necessary non-value-added', NVA: 'Non-value-added' };

const WASTES = [
  { k: 'Transportation', d: 'Moving material or product more than needed' },
  { k: 'Inventory', d: 'Ingredients, WIP or finished goods beyond what flow needs' },
  { k: 'Motion', d: 'People walking, reaching or searching' },
  { k: 'Waiting', d: 'People, product or equipment idle' },
  { k: 'Overproduction', d: 'Making more or earlier than the next step needs' },
  { k: 'Over-processing', d: 'Work or checks that add no value the customer needs' },
  { k: 'Defects', d: 'Scrap, rework, holds, giveaway' },
  { k: 'Skills', d: 'Unused talent and ideas of people' },
];

const FIELDS = [
  { k: 'cycleTime', label: 'Cycle time', unit: 's/unit', how: 'Stopwatch: time between successive units leaving the step. Time 10+ consecutive cycles in 3 different periods; record min / avg / max.' },
  { k: 'processTime', label: 'Processing time (value-added)', unit: 'min', how: 'Time the product is actually being transformed at this step (mix time, bake time, freeze dwell). From recipe/spec and confirmed by observation.' },
  { k: 'changeover', label: 'Changeover time', unit: 'min', how: 'Last good unit of product A to first good unit of product B. Observe 3+ changeovers; also pull the changeover log.' },
  { k: 'changeoversPerWeek', label: 'Changeovers per week', unit: '/week', how: 'Count from the production schedule or changeover log, last 4 weeks average.' },
  { k: 'downtime', label: 'Unplanned downtime', unit: 'min/shift', how: 'Downtime log, last 4 weeks, average minutes per shift; capture top 3 causes.' },
  { k: 'uptime', label: 'Uptime', unit: '%', how: '(Planned time − unplanned downtime − changeover) ÷ planned time, from line records.' },
  { k: 'labor', label: 'Labor', unit: 'people', how: 'Operators assigned to the step per shift (staffing plan), confirmed by observation.' },
  { k: 'throughput', label: 'Throughput', unit: 'units/hr', how: 'Count good units over at least 1 hour of normal running, or pull from line counter.' },
  { k: 'scrap', label: 'Scrap', unit: '%', how: 'Scrap weight ÷ input weight at the step, from the scrap log or a shift weigh-out.' },
  { k: 'yield', label: 'Yield', unit: '%', how: 'Good output ÷ input (weight basis), from production records.' },
  { k: 'wip', label: 'WIP before step', unit: 'units', how: 'Physical count of product or batches waiting in front of the step at the time of the walk; repeat at 2–3 times.' },
  { k: 'walkDist', label: 'Operator walking', unit: 'ft/shift', how: 'From the spaghetti diagram: measured route length × trips per shift (or pedometer).' },
  { k: 'transportDist', label: 'Transport distance', unit: 'ft/trip', how: 'Measured route from the previous step (tape / wheel / plant drawing).' },
  { k: 'waitTime', label: 'Waiting time before step', unit: 'min', how: 'Observed hold / queue time. Used for lead time only where WIP was not counted.' },
  { k: 'oee', label: 'OEE', unit: '%', how: 'Availability × Performance × Quality from line data. Equipment steps only.' },
  { k: 'opCost', label: 'Operating cost', unit: '$/hr', how: 'From Finance: labor + utilities + overhead rate for the step. Do not estimate without Finance.' },
];
const FIELD = Object.fromEntries(FIELDS.map((f) => [f.k, f]));

const SETTINGS = [
  { k: 'demandPerDay', label: 'Customer demand', unit: 'units/day', how: 'Planning: average daily requirement for this line, last 13 weeks.' },
  { k: 'shiftsPerDay', label: 'Shifts per day', unit: 'shifts', how: 'Planning / production schedule.' },
  { k: 'minPerShift', label: 'Shift length', unit: 'min', how: 'Scheduled minutes per shift.' },
  { k: 'breakMin', label: 'Planned breaks & meetings', unit: 'min/shift', how: 'Scheduled breaks, lunch, huddles, planned sanitation inside the shift.' },
  { k: 'daysPerYear', label: 'Operating days per year', unit: 'days', how: 'Planning: production calendar.' },
  { k: 'weeksPerYear', label: 'Operating weeks per year', unit: 'weeks', how: 'Planning: production calendar.' },
  { k: 'laborRate', label: 'Loaded labor rate', unit: '$/hr', how: 'Finance only. Do not use an estimate for reported savings.' },
  { k: 'materialCost', label: 'Material cost per unit', unit: '$/unit', how: 'Finance: standard material cost per unit (for scrap valuation at cost).' },
  { k: 'walkSpeed', label: 'Walking speed', unit: 'ft/min', how: 'Industrial-engineering planning value is 264 ft/min (3 mph); replace with observed values.' },
  { k: 'forkliftSpeed', label: 'Forklift / pallet-jack speed', unit: 'ft/min', how: 'Observe loaded travel; plant speed limits apply.' },
];

const ROUTE_CATS = {
  walk: { label: 'Employee walking', color: '#2F6FB0', speedKey: 'walkSpeed' },
  forklift: { label: 'Forklift', color: '#C2410C', speedKey: 'forkliftSpeed' },
  ingredient: { label: 'Ingredient movement', color: '#2F9E6E', speedKey: 'walkSpeed' },
  product: { label: 'Product transport', color: '#6E59A5', speedKey: 'walkSpeed' },
};

const FLOW_KINDS = {
  start: 'Start / end', operation: 'Operation', decision: 'Decision', inspection: 'Inspection',
  transport: 'Material transfer', delay: 'Delay / hold', storage: 'Storage', rework: 'Rework', scrap: 'Scrap / reject', end: 'End',
};
const ACT_TYPES = { O: 'Operation', T: 'Transportation', I: 'Inspection', D: 'Delay', S: 'Storage' };
const SWIM_KINDS = { task: 'Task', approval: 'Approval / sign-off', handoff: 'Handoff', delay: 'Wait / delay', decision: 'Decision' };
const SWIM_FLAGS = { duplicate: 'Duplicated work', unnecessary: 'Unnecessary approval', delay: 'Delay', gap: 'Communication gap' };
const ACTION_STATUS = ['Not started', 'In progress', 'Blocked', 'Done'];
const FIN_CATS = ['Hard savings', 'Cost avoidance', 'Capacity', 'Nonfinancial', 'Not yet classified'];
const FIN_STATUS = ['Not started', 'Method agreed with Finance', 'In verification', 'Validated by Finance', 'Rejected'];

/* ---------------- helpers ---------------- */
const uid = (p = '') => p + Math.random().toString(36).slice(2, 9);
const clone = (o) => JSON.parse(JSON.stringify(o));
const F = (v = null, s = 'EST', src = '') => ({ v, s: v == null ? 'NYC' : s, src });
const val = (f) => (f && f.v !== null && f.v !== '' && f.v !== undefined && isFinite(+f.v) ? +f.v : null);
const fstat = (f) => (val(f) == null ? 'NYC' : f.s === 'VER' ? 'VER' : 'EST');
const worst = (arr) => (arr.includes('NYC') ? 'NYC' : arr.includes('EST') ? 'EST' : arr.length ? 'VER' : 'NYC');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 1) => (n == null || !isFinite(n) ? '—' : Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('en-US') : (+n.toFixed(d)).toLocaleString('en-US'));
const money = (n) => (n == null || !isFinite(n) ? '—' : (n < 0 ? '−$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US'));
const pct = (n, d = 1) => (n == null || !isFinite(n) ? '—' : (n * 100).toFixed(d) + '%');
const todayISO = () => new Date().toISOString().slice(0, 10);

/* ---------------- templates ---------------- */
function mkStep(name, dept, opts = {}) {
  const f = {};
  FIELDS.forEach((fd) => (f[fd.k] = F()));
  return {
    id: uid('s'), name, dept, owner: '', equipment: opts.equipment || '', applic: opts.applic || 'To verify',
    vaClass: opts.vaClass || 'VA', kind: opts.kind || 'operation',
    fsq: Object.assign({ foodSafety: '', allergen: '', sanitation: '', trace: '', qc: '' }, opts.fsq || {}),
    f, notes: opts.notes || '',
  };
}

function defaultFlow(steps) {
  // Build a process flow from the step list with standard inspection / decision branches.
  const nodes = [], edges = [];
  const N = (kind, label, extra = {}) => { const n = Object.assign({ id: uid('n'), kind, label, x: 0, y: 0, dept: '' }, extra); nodes.push(n); return n; };
  const E = (a, b, label = '') => edges.push({ id: uid('e'), from: a.id, to: b.id, label });
  const main = [];
  const start = N('start', 'Ingredients arrive'); main.push(start);
  let prev = start, rejectNode = null, holdNode = null;
  steps.forEach((s) => {
    if (s.applic === 'Not applicable') return;
    const k = s.kind === 'storage' ? 'storage' : 'operation';
    const n = N(k, s.name, { stepId: s.id, dept: s.dept });
    E(prev, n); main.push(n); prev = n;
    if (/Receiving/i.test(s.name)) {
      const d = N('decision', 'Meets spec?', { dept: 'Quality', branch: true }); E(n, d); main.push(d);
      rejectNode = N('scrap', 'Reject / return to supplier', { dept: 'Quality', side: d.id }); E(d, rejectNode, 'No');
      prev = d; d._yes = true;
    }
    if (/Ingredient Storage/i.test(s.name)) { const t = N('transport', 'Transfer to pre-weigh', { dept: 'Warehouse' }); E(n, t); main.push(t); prev = t; }
    if (/Dividing|Forming/i.test(s.name)) {
      const i = N('inspection', 'Piece weight check', { dept: 'Production' }); E(n, i); main.push(i);
      const d = N('decision', 'In spec?', { dept: 'Production' }); E(i, d); main.push(d);
      const rw = N('rework', 'Dough rework (if spec allows)', { dept: 'Production', side: d.id }); E(d, rw, 'No');
      const mix = main.find((m) => /Mixing/i.test(m.label)); if (mix) E(rw, mix, 'Return');
      prev = d;
    }
    if (/Packaging/i.test(s.name)) {
      const i = N('inspection', 'Metal detect / checkweigh', { dept: 'Quality' }); E(n, i); main.push(i);
      const d = N('decision', 'Pass?', { dept: 'Quality' }); E(i, d); main.push(d);
      holdNode = N('delay', 'Hold for QA disposition', { dept: 'Quality', side: d.id }); E(d, holdNode, 'No');
      const sc = N('scrap', 'Scrap', { dept: 'Quality', side: holdNode.id }); E(holdNode, sc, 'Reject');
      prev = d;
    }
  });
  const end = N('end', 'Shipped to customer'); E(prev, end); main.push(end);
  // label "Yes" on decision-to-next edges
  edges.forEach((e) => { const a = nodes.find((n) => n.id === e.from); if (a && a.kind === 'decision' && !e.label) e.label = 'Yes'; });
  autoLayoutFlow({ nodes, edges }, main.map((m) => m.id));
  return { nodes, edges };
}

function autoLayoutFlow(flow, mainOrder) {
  const perRow = 6, dx = 190, dy = 230, x0 = 110, y0 = 80;
  const order = mainOrder || flow.nodes.filter((n) => !n.side).map((n) => n.id);
  order.forEach((id, i) => {
    const n = flow.nodes.find((m) => m.id === id); if (!n) return;
    const r = Math.floor(i / perRow), c = i % perRow;
    n.x = x0 + (r % 2 === 0 ? c : perRow - 1 - c) * dx; n.y = y0 + r * dy;
  });
  flow.nodes.filter((n) => n.side).forEach((n) => {
    const p = flow.nodes.find((m) => m.id === n.side);
    if (p) { n.x = p.x; n.y = p.y + 105; if (flow.nodes.some((o) => o !== n && o.side === p.id && o.y === n.y)) n.x += 150; }
  });
  // second-level side nodes (e.g. scrap under hold)
  flow.nodes.filter((n) => n.side && flow.nodes.find((m) => m.id === n.side && m.side)).forEach((n) => {
    const p = flow.nodes.find((m) => m.id === n.side); n.x = p.x + 160; n.y = p.y;
  });
}

function defaultActivities(steps) {
  const A = [];
  steps.forEach((s, i) => {
    if (s.applic === 'Not applicable') return;
    const add = (type, desc, va) => A.push({ id: uid('a'), stepId: s.id, desc, type, time: null, dist: null, people: null, va, status: 'NYC', src: '', opportunity: '' });
    if (i > 0) add('T', 'Move from previous step', 'NVA');
    add('D', 'Wait / queue before ' + s.name.toLowerCase(), 'NVA');
    if (s.kind === 'storage') add('S', 'Held in ' + s.name.toLowerCase(), 'NVA');
    else add('O', s.name, s.vaClass === 'VA' ? 'VA' : 'NNVA');
    if (s.fsq.qc || s.fsq.foodSafety) add('I', 'Quality / food-safety check at ' + s.name.toLowerCase(), 'NNVA');
  });
  return A;
}

function defaultSwimlane() {
  const items = [];
  const I = (lane, col, label, kind = 'task') => { const it = { id: uid('w'), lane, col, label, kind, flags: {}, next: [] }; items.push(it); return it; };
  const a = I('Planning', 0, 'Issue production schedule');
  const b = I('Supervisors', 1, 'Assign crew & line');
  const c = I('Warehouse', 1, 'Stage ingredients', 'handoff');
  const d = I('Sanitation', 2, 'Complete sanitation & pre-op clean');
  const e = I('Quality', 3, 'Pre-op inspection sign-off', 'approval');
  const f = I('Maintenance', 3, 'Start-up equipment checks');
  const g = I('Production', 4, 'Pre-weigh & allergen verification');
  const h = I('Quality', 5, 'Start-up / label approval', 'approval');
  const i = I('Production', 6, 'Run, freeze, pack');
  const j = I('Quality', 7, 'In-process checks & release', 'approval');
  const k = I('Warehouse', 8, 'Put away to cold storage', 'handoff');
  a.next = [b.id, c.id]; b.next = [d.id]; c.next = [g.id]; d.next = [e.id, f.id]; e.next = [g.id]; f.next = [g.id]; g.next = [h.id]; h.next = [i.id]; i.next = [j.id]; j.next = [k.id];
  return items;
}

function newState(kind) {
  const steps = genericSteps(kind);
  return { steps, flow: defaultFlow(steps), acts: defaultActivities(steps), layout: defaultLayout(), routes: [], swim: defaultSwimlane() };
}

function newLine(name, kind = 'generic') {
  return { id: uid('L'), name, unit: 'case', settings: defaultSettings(), current: newState(kind), future: null, notes: kind === 'nugget' ? 'Model line. Process sequence is the plant-wide starting template and must be verified on the floor walk.' : 'Template only. Steps copied from the plant-wide sequence; verify equipment and steps for this line.' };
}

/* =====================================================================
   Calculation engine. Every result = {v, s, missing[], formula, note}
   s: 'VER' only when every input is verified; 'EST' if any estimate;
      'NYC' (incomplete) if any required input is not yet collected.
   Partial sums are shown as "≥ value" and flagged incomplete.
   ===================================================================== */

const FORMULAS = [
  ['Available time per day', 'Shifts/day × (Shift length − Planned breaks)', 'min/day'],
  ['Takt time', 'Available time per day × 60 ÷ Customer demand per day', 's/unit'],
  ['Effective cycle time (per step)', 'Cycle time ÷ Uptime. Where uptime is not collected, cycle time is used and the result is marked Estimate.', 's/unit'],
  ['Bottleneck', 'Step with the highest effective cycle time among steps that apply to the line', ''],
  ['Line capacity', '3600 ÷ Bottleneck effective cycle time', 'units/hr'],
  ['Queue time (per step)', 'WIP before step ÷ Demand per day × Available time per day. If WIP was not counted, the observed Waiting time is used.', 'min'],
  ['Total lead time', 'Σ Queue time + Σ Processing time over applicable steps', 'min'],
  ['Value-added time', 'Σ Processing time of steps classified Value-added', 'min'],
  ['Non-value-added time', 'Total lead time − Value-added time', 'min'],
  ['Process cycle efficiency (PCE)', 'Value-added time ÷ Total lead time', '%'],
  ['Rolled throughput yield', 'Π (Yield) over steps; where yield is missing, (1 − Scrap) is used', '%'],
  ['Changeover time per week', 'Σ (Changeover time × Changeovers per week) ÷ 60', 'hr/week'],
  ['Route distance', 'Σ segment lengths of the drawn route × layout scale (1 unit = 1 ft)', 'ft/trip'],
  ['Travel time per shift', 'Route distance × Trips per shift ÷ Speed for the movement category', 'min/shift'],
  ['Annual travel labor hours', 'Travel time per shift × People × Shifts/day × Operating days/year ÷ 60', 'hr/yr'],
  ['Annual travel labor cost', 'Annual travel labor hours × Loaded labor rate', '$/yr'],
  ['Estimated annual labor savings (travel)', 'Current annual travel labor cost − Future annual travel labor cost', '$/yr'],
  ['Changeover reduction', '(Current − Future changeover hours/week) × Operating weeks/year; labor value = Σ hours × step labor × labor rate', 'hr/yr'],
  ['Scrap reduction opportunity', '(Future RTY − Current RTY) × Demand/day × Operating days/year × Material cost/unit (valued at cost)', '$/yr'],
  ['Throughput improvement potential', '(Future capacity − Current capacity) ÷ Current capacity', '%'],
  ['Labor productivity', 'Line capacity ÷ Total labor on the line', 'units/labor-hr'],
  ['PAM totals', 'Σ activity time, distance and people-minutes by activity type (O, T, I, D, S); NVA time = Σ time of activities marked NVA', 'min / ft'],
];

function R(v, s, missing = [], formula = '', note = '') { return { v, s, missing, formula, note }; }

function lineState(line, key) { return key === 'future' && line.future ? line.future : line.current; }
function applicable(steps) { return steps.filter((s) => s.applic !== 'Not applicable'); }

function calcState(line, key = 'current') {
  const S = lineState(line, key);
  const st = line.settings;
  const out = { steps: {}, key };
  const g = (k) => val(st[k]);
  const gs = (k) => fstat(st[k]);

  // available time & takt
  const shifts = g('shiftsPerDay'), len = g('minPerShift'), brk = g('breakMin'), dem = g('demandPerDay');
  const availMiss = [['shiftsPerDay', shifts], ['minPerShift', len], ['breakMin', brk]].filter((x) => x[1] == null).map((x) => SETTINGS.find((s) => s.k === x[0]).label);
  const avail = availMiss.length ? null : shifts * (len - brk);
  out.avail = R(avail, availMiss.length ? 'NYC' : worst([gs('shiftsPerDay'), gs('minPerShift'), gs('breakMin')]), availMiss, FORMULAS[0][1]);
  out.takt = R(avail != null && dem ? (avail * 60) / dem : null, avail != null && dem != null ? worst([out.avail.s, gs('demandPerDay')]) : 'NYC', [...availMiss, ...(dem == null ? ['Customer demand'] : [])], FORMULAS[1][1]);

  const steps = applicable(S.steps);
  let ltSum = 0, ltMiss = [], ltStat = [], vaSum = 0, vaMiss = [], vaStat = [], best = null, ctCount = 0;
  let rty = 1, rtyStat = [], rtyMiss = [], coH = 0, coStat = [], laborSum = 0, laborStat = [], laborMiss = [];
  steps.forEach((s) => {
    const f = s.f, r = {};
    const ct = val(f.cycleTime), up = val(f.uptime), pt = val(f.processTime), wip = val(f.wip), wt = val(f.waitTime);
    // effective CT
    if (ct != null) {
      ctCount++;
      const ect = up ? ct / (up / 100) : ct;
      r.ect = R(ect, up ? worst([fstat(f.cycleTime), fstat(f.uptime)]) : 'EST', up ? [] : ['Uptime (assumed 100%)'], FORMULAS[2][1]);
      if (!best || ect > best.ect.v) best = { step: s, ect: r.ect };
    } else r.ect = R(null, 'NYC', ['Cycle time'], FORMULAS[2][1]);
    // queue time
    if (wip != null && dem && avail != null) r.queue = R((wip / dem) * avail, worst([fstat(f.wip), gs('demandPerDay'), out.avail.s]), [], FORMULAS[5][1]);
    else if (wt != null) r.queue = R(wt, fstat(f.waitTime), [], FORMULAS[5][1], 'Observed waiting time used (WIP not counted)');
    else r.queue = R(null, 'NYC', ['WIP before step or Waiting time' + (wip != null ? ' (demand / available time missing)' : '')], FORMULAS[5][1]);
    if (r.queue.v != null) { ltSum += r.queue.v; ltStat.push(r.queue.s); } else ltMiss.push(s.name + ': queue');
    if (pt != null) { ltSum += pt; ltStat.push(fstat(f.processTime)); if (s.vaClass === 'VA') { vaSum += pt; vaStat.push(fstat(f.processTime)); } }
    else { ltMiss.push(s.name + ': processing time'); if (s.vaClass === 'VA') vaMiss.push(s.name); }
    // yield
    const y = val(f.yield), sc = val(f.scrap);
    if (y != null) { rty *= y / 100; rtyStat.push(fstat(f.yield)); } else if (sc != null) { rty *= 1 - sc / 100; rtyStat.push(fstat(f.scrap)); } else rtyMiss.push(s.name);
    // changeover
    const co = val(f.changeover), cpw = val(f.changeoversPerWeek);
    if (co != null && cpw != null) { coH += (co * cpw) / 60; coStat.push(worst([fstat(f.changeover), fstat(f.changeoversPerWeek)])); r.coH = (co * cpw) / 60; }
    const lab = val(f.labor);
    if (lab != null) { laborSum += lab; laborStat.push(fstat(f.labor)); } else laborMiss.push(s.name);
    out.steps[s.id] = r;
  });
  out.ctCoverage = { measured: ctCount, total: steps.length };
  out.leadTime = R(ltStat.length ? ltSum : null, ltMiss.length ? 'NYC' : worst(ltStat), ltMiss, FORMULAS[6][1]);
  out.vaTime = R(vaStat.length ? vaSum : null, vaMiss.length ? 'NYC' : worst(vaStat), vaMiss, FORMULAS[7][1]);
  out.nvaTime = R(ltStat.length ? ltSum - vaSum : null, worst([out.leadTime.s, out.vaTime.s]), [...ltMiss], FORMULAS[8][1]);
  out.pce = R(ltStat.length && ltSum > 0 ? vaSum / ltSum : null, worst([out.leadTime.s, out.vaTime.s]), ltMiss, FORMULAS[9][1]);
  out.bottleneck = best ? { stepId: best.step.id, name: best.step.name, ect: best.ect } : null;
  out.bnECT = best ? best.ect : R(null, 'NYC', ['Cycle time at every step'], FORMULAS[3][1]);
  if (best && ctCount < steps.length) out.bnECT = R(best.ect.v, 'NYC', [`Cycle time at ${steps.length - ctCount} of ${steps.length} steps`], FORMULAS[3][1], 'Bottleneck is provisional until every step is timed');
  out.capacity = R(best ? 3600 / best.ect.v : null, out.bnECT.s, out.bnECT.missing, FORMULAS[4][1]);
  out.rty = R(rtyMiss.length === steps.length ? null : rty, rtyMiss.length ? 'NYC' : worst(rtyStat), rtyMiss, FORMULAS[10][1]);
  out.coHours = R(coStat.length ? coH : null, coStat.length ? worst(coStat) : 'NYC', coStat.length ? [] : ['Changeover time and changeovers/week'], FORMULAS[11][1]);
  out.labor = R(laborStat.length ? laborSum : null, laborMiss.length ? 'NYC' : worst(laborStat), laborMiss, 'Σ Labor over applicable steps');
  out.productivity = R(out.capacity.v != null && laborSum ? out.capacity.v / laborSum : null, worst([out.capacity.s, out.labor.s]), [...out.capacity.missing, ...laborMiss], FORMULAS[20][1]);

  // travel
  out.routes = {};
  const totals = {}; let travelCost = 0, travelHrs = 0, travelStat = [], travelMiss = [];
  (S.routes || []).forEach((r) => {
    const d = routeLength(r.points);
    const cat = ROUTE_CATS[r.cat] || ROUTE_CATS.walk;
    const spd = g(cat.speedKey), trips = val(r.trips), ppl = val(r.people);
    const res = { dist: d };
    res.distShift = trips != null ? d * trips : null;
    res.timeShift = res.distShift != null && spd ? res.distShift / spd : null;
    const yrMiss = [];
    if (trips == null) yrMiss.push('Trips per shift'); if (!spd) yrMiss.push(SETTINGS.find((s) => s.k === cat.speedKey).label);
    if (ppl == null) yrMiss.push('People'); if (shifts == null) yrMiss.push('Shifts per day'); if (g('daysPerYear') == null) yrMiss.push('Operating days per year');
    const stats = [r.status === 'VER' ? 'VER' : 'EST', fstat(r.trips), fstat(r.people), gs(cat.speedKey), gs('shiftsPerDay'), gs('daysPerYear')];
    res.hrsYear = R(yrMiss.length ? null : (res.timeShift * ppl * shifts * g('daysPerYear')) / 60, yrMiss.length ? 'NYC' : worst(stats), yrMiss, FORMULAS[14][1]);
    const rate = g('laborRate');
    res.costYear = R(res.hrsYear.v != null && rate != null ? res.hrsYear.v * rate : null, res.hrsYear.v != null && rate != null ? worst([res.hrsYear.s, gs('laborRate')]) : 'NYC', [...yrMiss, ...(rate == null ? ['Loaded labor rate'] : [])], FORMULAS[15][1]);
    if (res.hrsYear.v != null) travelHrs += res.hrsYear.v; if (res.costYear.v != null) { travelCost += res.costYear.v; travelStat.push(res.costYear.s); } else travelMiss.push(r.name);
    const t = (totals[r.cat] = totals[r.cat] || { dist: 0, distShift: 0, time: 0 });
    t.dist += d; t.distShift += res.distShift || 0; t.time += res.timeShift || 0;
    out.routes[r.id] = res;
  });
  out.travelTotals = totals;
  out.travelHrs = R(travelStat.length ? travelHrs : null, travelMiss.length || !(S.routes || []).length ? 'NYC' : worst(travelStat), travelMiss, FORMULAS[14][1]);
  out.travelCost = R((S.routes || []).length ? travelCost : null, travelMiss.length || !(S.routes || []).length ? 'NYC' : worst(travelStat), travelMiss, FORMULAS[15][1]);

  // PAM
  const pam = { byType: {}, time: 0, nva: 0, va: 0, dist: 0, peopleMin: 0, missing: 0, stat: [] };
  Object.keys(ACT_TYPES).forEach((k) => (pam.byType[k] = { n: 0, time: 0, dist: 0 }));
  (S.acts || []).forEach((a) => {
    const b = pam.byType[a.type]; b.n++;
    if (a.time == null || a.time === '') { pam.missing++; return; }
    const t = +a.time; b.time += t; pam.time += t; if (a.va === 'NVA') pam.nva += t; if (a.va === 'VA') pam.va += t;
    if (a.dist) { b.dist += +a.dist; pam.dist += +a.dist; }

    pam.stat.push(a.status === 'VER' ? 'VER' : 'EST');
  });
  pam.s = pam.missing ? 'NYC' : worst(pam.stat);
  out.pam = pam;

  // data completeness
  let tot = 0, got = 0, ver = 0;
  steps.forEach((s) => FIELDS.forEach((fd) => { tot++; const x = fstat(s.f[fd.k]); if (x !== 'NYC') got++; if (x === 'VER') ver++; }));
  SETTINGS.forEach((sd) => { tot++; const x = gs(sd.k); if (x !== 'NYC') got++; if (x === 'VER') ver++; });
  out.completeness = { tot, got, ver };
  return out;
}

function routeLength(pts) { let d = 0; for (let i = 1; i < (pts || []).length; i++) d += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return d; }

/* current vs future comparison & estimated savings (never reported as validated) */
function calcCompare(line) {
  const c = calcState(line, 'current');
  if (!line.future) return { c, f: null };
  const f = calcState(line, 'future');
  const st = line.settings, g = (k) => val(st[k]);
  const res = { c, f };
  const both = (a, b) => worst([a.s, b.s]);
  res.travelSavings = R(c.travelCost.v != null && f.travelCost.v != null ? c.travelCost.v - f.travelCost.v : null, both(c.travelCost, f.travelCost), [...c.travelCost.missing, ...f.travelCost.missing], FORMULAS[16][1]);
  res.travelHrsSaved = R(c.travelHrs.v != null && f.travelHrs.v != null ? c.travelHrs.v - f.travelHrs.v : null, both(c.travelHrs, f.travelHrs), [], 'Current − Future annual travel labor hours');
  // changeover
  const wk = g('weeksPerYear');
  let coHrsYr = null, coValue = null, coMiss = [];
  if (c.coHours.v != null && f.coHours.v != null && wk != null) {
    coHrsYr = (c.coHours.v - f.coHours.v) * wk;
    let laborHrs = 0;
    applicable(line.current.steps).forEach((s) => {
      const fs = line.future.steps.find((x) => x.id === s.id); if (!fs) return;
      const ch = c.steps[s.id] && c.steps[s.id].coH, fh = f.steps[fs.id] && f.steps[fs.id].coH, lab = val(s.f.labor);
      if (ch != null && fh != null && lab != null) laborHrs += (ch - fh) * wk * lab;
    });
    coValue = g('laborRate') != null ? laborHrs * g('laborRate') : null;
  } else coMiss.push('Changeover data in both states and operating weeks/year');
  res.coHrsYr = R(coHrsYr, coMiss.length ? 'NYC' : worst([c.coHours.s, f.coHours.s, fstat(st.weeksPerYear)]), coMiss, FORMULAS[17][1]);
  res.coValue = R(coValue, coValue == null ? 'NYC' : worst([res.coHrsYr.s, fstat(st.laborRate)]), coValue == null ? [...coMiss, 'Loaded labor rate'] : [], FORMULAS[17][1], 'Capacity unless paid hours are removed — Finance decides');
  // scrap
  const dem = g('demandPerDay'), days = g('daysPerYear'), mc = g('materialCost');
  const scMiss = [];
  if (c.rty.v == null || f.rty.v == null) scMiss.push('Scrap / yield in both states'); if (dem == null) scMiss.push('Customer demand'); if (days == null) scMiss.push('Operating days/year'); if (mc == null) scMiss.push('Material cost per unit');
  res.scrapSavings = R(scMiss.length ? null : (f.rty.v - c.rty.v) * dem * days * mc, scMiss.length ? 'NYC' : worst([c.rty.s, f.rty.s, fstat(st.demandPerDay), fstat(st.daysPerYear), fstat(st.materialCost)]), scMiss, FORMULAS[18][1]);
  // throughput
  res.throughputGain = R(c.capacity.v && f.capacity.v ? (f.capacity.v - c.capacity.v) / c.capacity.v : null, both(c.capacity, f.capacity), [...c.capacity.missing, ...f.capacity.missing], FORMULAS[19][1]);
  return res;
}

function statusLabel(s) { return s === 'VER' ? 'Verified inputs' : s === 'EST' ? 'Estimate' : 'Incomplete'; }

/* =====================================================================
   Diagram renderers. Each returns {svg, w, h}. Colors come from a
   palette object so exports can always use the light print palette.
   ===================================================================== */

const PALETTES = {
  light: { bg: '#FFFFFF', grid: '#E7ECF2', grid2: '#D3DBE5', ink: '#14202E', muted: '#5E6B7A', line: '#46566A', node: '#FFFFFF', stroke: '#13315C', accent: '#13315C', green: '#2F9E6E', amber: '#B9770E', red: '#C0392B', soft: '#EEF2F6', soft2: '#F7F9FB', sel: '#2F6FB0' },
  dark: { bg: '#0F1822', grid: '#1A2633', grid2: '#243344', ink: '#E6EDF5', muted: '#93A3B5', line: '#8FA3B8', node: '#162231', stroke: '#8EB4E3', accent: '#8EB4E3', green: '#4CC48F', amber: '#E3A640', red: '#E86A5A', soft: '#1B2836', soft2: '#142030', sel: '#6FA8E8' },
};

function wrapText(t, max) {
  const words = String(t || '').split(/\s+/); const lines = []; let cur = '';
  words.forEach((w) => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) lines.push(cur); return lines.slice(0, 3);
}
function textLines(x, y, lines, opts = {}) {
  const lh = opts.lh || 14, fs = opts.fs || 12, fill = opts.fill, anchor = opts.anchor || 'middle', weight = opts.weight || 400;
  const y0 = y - ((lines.length - 1) * lh) / 2;
  return `<text x="${x}" text-anchor="${anchor}" font-size="${fs}" font-weight="${weight}" fill="${fill}" font-family="IBM Plex Sans, Arial, sans-serif">` +
    lines.map((l, i) => `<tspan x="${x}" y="${(y0 + i * lh + fs * 0.35).toFixed(1)}">${esc(l)}</tspan>`).join('') + '</text>';
}
function arrowDefs(P, extra = '') {
  return `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${P.line}"/></marker>` +
    `<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${P.sel}"/></marker>${extra}</defs>`;
}
function svgWrap(w, h, body, P, title) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="IBM Plex Sans, Arial, sans-serif"><title>${esc(title)}</title><rect width="${w}" height="${h}" fill="${P.bg}"/>${body}</svg>`;
}
function demoWatermark(P, w, h, on) { return on ? `<text x="${w - 16}" y="${h - 14}" text-anchor="end" font-size="13" font-weight="700" fill="${P.amber}" letter-spacing="1.5">DEMONSTRATION DATA — NOT PLANT MEASUREMENTS</text>` : ''; }

/* ---------------- Process flow ---------------- */
const NODE_SIZE = { start: [150, 44], end: [150, 44], operation: [150, 58], decision: [130, 86], inspection: [130, 58], transport: [140, 52], delay: [130, 58], storage: [110, 84], rework: [150, 58], scrap: [140, 52] };
function nodeBox(n) { const [w, h] = NODE_SIZE[n.kind] || [150, 58]; return { x: n.x - w / 2, y: n.y - h / 2, w, h }; }
function clipToBox(cx, cy, tx, ty, b, kind) {
  const dx = tx - cx, dy = ty - cy; if (!dx && !dy) return [cx, cy];
  let hw = b.w / 2, hh = b.h / 2;
  if (kind === 'decision') { const t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh); return [cx + dx * t, cy + dy * t]; }
  const t = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9)); return [cx + dx * t, cy + dy * t];
}
function nodeShape(n, P, selected) {
  const b = nodeBox(n), s = selected ? P.sel : n.kind === 'scrap' ? P.red : n.kind === 'rework' ? P.amber : P.stroke;
  const sw = selected ? 3 : 1.6, fill = n.kind === 'start' || n.kind === 'end' ? P.soft : P.node;
  const dash = n.kind === 'rework' ? ' stroke-dasharray="6 4"' : '';
  let shape = '', lines = wrapText(n.label, n.kind === 'decision' ? 14 : 18), ty = n.y;
  switch (n.kind) {
    case 'start': case 'end': shape = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.h / 2}" fill="${fill}" stroke="${s}" stroke-width="${sw}"/>`; break;
    case 'decision': shape = `<polygon points="${n.x},${b.y} ${b.x + b.w},${n.y} ${n.x},${b.y + b.h} ${b.x},${n.y}" fill="${fill}" stroke="${s}" stroke-width="${sw}"/>`; break;
    case 'inspection': shape = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${fill}" stroke="${s}" stroke-width="${sw}"/><rect x="${b.x + 4}" y="${b.y + 4}" width="${b.w - 8}" height="${b.h - 8}" fill="none" stroke="${s}" stroke-width="1"/><path d="M${b.x + b.w - 20},${b.y + 14} l4,4 l8,-9" fill="none" stroke="${P.green}" stroke-width="2"/>`; break;
    case 'transport': shape = `<polygon points="${b.x},${b.y} ${b.x + b.w - 18},${b.y} ${b.x + b.w},${n.y} ${b.x + b.w - 18},${b.y + b.h} ${b.x},${b.y + b.h}" fill="${fill}" stroke="${s}" stroke-width="${sw}"/>`; break;
    case 'delay': shape = `<path d="M${b.x},${b.y} H${b.x + b.w - b.h / 2} A${b.h / 2},${b.h / 2} 0 0 1 ${b.x + b.w - b.h / 2},${b.y + b.h} H${b.x} Z" fill="${fill}" stroke="${s}" stroke-width="${sw}"/>`; break;
    case 'storage': shape = `<polygon points="${n.x - 30},${b.y} ${n.x + 30},${b.y} ${n.x},${b.y + 46}" fill="${fill}" stroke="${s}" stroke-width="${sw}"/>`; ty = b.y + 66; lines = wrapText(n.label, 20).slice(0, 2); break;
    case 'scrap': shape = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" fill="${fill}" stroke="${s}" stroke-width="${sw}"/><path d="M${b.x + 8},${b.y + 8} l8,8 m0,-8 l-8,8" stroke="${P.red}" stroke-width="2"/>`; break;
    default: shape = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" fill="${fill}" stroke="${s}" stroke-width="${sw}"${dash}/>`;
  }
  const dot = n.dept ? `<circle cx="${n.kind === 'storage' ? n.x + 34 : b.x + 10}" cy="${n.kind === 'storage' ? b.y + 8 : b.y + 10}" r="5" fill="${DEPT_COLORS[n.dept] || P.muted}"><title>${esc(n.dept)}</title></circle>` : '';
  return `<g class="fnode" data-id="${n.id}" style="cursor:move">${shape}${dot}${textLines(n.x, ty, lines, { fill: P.ink, fs: 12, lh: 14 })}</g>`;
}
function svgFlow(line, key, P, opts = {}) {
  const S = lineState(line, key), fl = S.flow;
  let maxX = 600, maxY = 400;
  fl.nodes.forEach((n) => { const b = nodeBox(n); maxX = Math.max(maxX, b.x + b.w + 60); maxY = Math.max(maxY, b.y + b.h + 90); });
  let body = arrowDefs(P);
  // grid
  body += `<g opacity="0.7">`; for (let x = 0; x < maxX; x += 40) body += `<line x1="${x}" y1="0" x2="${x}" y2="${maxY}" stroke="${P.grid}" stroke-width="1"/>`; for (let y = 0; y < maxY; y += 40) body += `<line x1="0" y1="${y}" x2="${maxX}" y2="${y}" stroke="${P.grid}" stroke-width="1"/>`; body += `</g>`;
  fl.edges.forEach((e) => {
    const a = fl.nodes.find((n) => n.id === e.from), b = fl.nodes.find((n) => n.id === e.to); if (!a || !b) return;
    const [x1, y1] = clipToBox(a.x, a.y, b.x, b.y, nodeBox(a), a.kind), [x2, y2] = clipToBox(b.x, b.y, a.x, a.y, nodeBox(b), b.kind);
    const sel = opts.selected === e.id;
    body += `<g class="fedge" data-id="${e.id}" style="cursor:pointer"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="14"/><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${sel ? P.sel : P.line}" stroke-width="${sel ? 2.6 : 1.6}" marker-end="url(#${sel ? 'ahs' : 'ah'})"/>`;
    if (e.label) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = e.label.length * 6.5 + 10; body += `<rect x="${mx - w / 2}" y="${my - 9}" width="${w}" height="18" rx="9" fill="${P.bg}" stroke="${P.grid2}"/><text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="11" fill="${P.muted}">${esc(e.label)}</text>`; }
    body += `</g>`;
  });
  fl.nodes.forEach((n) => (body += nodeShape(n, P, opts.selected === n.id || opts.connectFrom === n.id)));
  body += demoWatermark(P, maxX, maxY, opts.demo);
  return { svg: svgWrap(maxX, maxY, body, P, `${line.name} — process flow (${key} state)`), w: maxX, h: maxY };
}

/* ---------------- Value stream map ---------------- */
function vsmVal(f, unit, d = 1) { const v = val(f); return v == null ? 'NYC' : fmt(v, d) + (unit ? ' ' + unit : ''); }
function svgVSM(line, key, P, opts = {}) {
  const S = lineState(line, key), calc = calcState(line, key), steps = applicable(S.steps);
  const colW = 220, x0 = 120, boxW = 150, boxY = 250, boxH = 66, dataH = 7 * 17 + 10;
  const n = steps.length, w = x0 + n * colW + 300, h = 640;
  let b = arrowDefs(P);
  const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-size="${o.fs || 11}" font-weight="${o.w || 400}" fill="${o.c || P.ink}">${esc(t)}</text>`;
  // supplier / customer / production control
  const factory = (x, y, label, sub) => `<path d="M${x},${y + 50} V${y + 14} l20,-14 v14 l20,-14 v14 l20,-14 v14 h20 v50 z" fill="${P.soft}" stroke="${P.stroke}" stroke-width="1.5"/>${T(x + 50, y + 66, label, { w: 600 })}${sub ? T(x + 50, y + 80, sub, { c: P.muted, fs: 10 }) : ''}`;
  b += factory(20, 30, 'Suppliers', 'Ingredients & packaging');
  const cx = x0 + n * colW + 40;
  const dem = val(line.settings.demandPerDay);
  b += factory(cx, 30, 'Customers', dem == null ? 'Demand: NYC' : `Demand: ${fmt(dem, 0)} ${line.unit}/day`);
  const pcx = x0 + (n * colW) / 2 - 90;
  b += `<rect x="${pcx}" y="28" width="180" height="56" fill="${P.node}" stroke="${P.stroke}" stroke-width="1.5"/>${T(pcx + 90, 52, 'Production Control', { w: 600 })}${T(pcx + 90, 68, 'Planning / scheduling', { c: P.muted, fs: 10 })}`;
  b += `<line x1="${cx}" y1="56" x2="${pcx + 180}" y2="56" stroke="${P.line}" stroke-dasharray="6 4" marker-end="url(#ah)"/>${T((cx + pcx + 180) / 2, 50, 'Customer orders', { c: P.muted, fs: 10 })}`;
  b += `<line x1="${pcx}" y1="56" x2="120" y2="56" stroke="${P.line}" stroke-dasharray="6 4" marker-end="url(#ah)"/>${T((pcx + 120) / 2, 50, 'Purchase orders', { c: P.muted, fs: 10 })}`;
  // schedule bus
  if (n) { const bx1 = x0 + boxW / 2, bx2 = x0 + (n - 1) * colW + boxW / 2; b += `<line x1="${pcx + 90}" y1="84" x2="${pcx + 90}" y2="200" stroke="${P.line}" stroke-dasharray="6 4"/><line x1="${bx1}" y1="200" x2="${bx2}" y2="200" stroke="${P.line}" stroke-dasharray="6 4"/>${T(pcx + 96, 194, 'Production schedule (method to verify)', { a: 'start', c: P.muted, fs: 10 })}`; steps.forEach((s, i) => (b += `<line x1="${x0 + i * colW + boxW / 2}" y1="200" x2="${x0 + i * colW + boxW / 2}" y2="${boxY - 2}" stroke="${P.line}" stroke-dasharray="6 4" marker-end="url(#ah)"/>`)); }
  // supplier → first, last → customer
  b += `<line x1="70" y1="112" x2="70" y2="${boxY + 30}" stroke="${P.line}" stroke-width="2"/><line x1="70" y1="${boxY + 30}" x2="${x0 - 52}" y2="${boxY + 30}" stroke="${P.line}" stroke-width="2" marker-end="url(#ah)"/>`;
  if (n) b += `<line x1="${x0 + (n - 1) * colW + boxW}" y1="${boxY + 30}" x2="${cx + 50}" y2="${boxY + 30}" stroke="${P.line}" stroke-width="2"/><line x1="${cx + 50}" y1="${boxY + 30}" x2="${cx + 50}" y2="114" stroke="${P.line}" stroke-width="2" marker-end="url(#ah)"/>`;
  const tlY = boxY + boxH + dataH + 60, hi = tlY, lo = tlY + 40;
  let ladder = `M${x0 - 70},${hi}`;
  const bnId = calc.bottleneck && calc.bottleneck.stepId;
  steps.forEach((s, i) => {
    const x = x0 + i * colW, r = calc.steps[s.id] || {}, isBn = s.id === bnId;
    // inventory triangle
    const tx = x - 40, wip = val(s.f.wip);
    b += `<polygon points="${tx - 16},${boxY + 46} ${tx + 16},${boxY + 46} ${tx},${boxY + 18}" fill="${P.soft}" stroke="${P.amber}" stroke-width="1.5"/>${T(tx, boxY + 40, 'I', { w: 700, c: P.amber, fs: 10 })}`;
    b += T(tx, boxY + 62, wip == null ? 'WIP NYC' : fmt(wip, 0) + ' ' + line.unit, { fs: 10, c: wip == null ? P.amber : P.ink });
    // push arrow from previous box
    if (i > 0) b += `<line x1="${x - colW + boxW + 2}" y1="${boxY + 30}" x2="${tx - 18}" y2="${boxY + 30}" stroke="${P.line}" stroke-width="5" stroke-dasharray="4 3" marker-end="url(#ah)"/>`;
    b += `<line x1="${tx + 18}" y1="${boxY + 30}" x2="${x - 2}" y2="${boxY + 30}" stroke="${P.line}" stroke-width="1.5" marker-end="url(#ah)"/>`;
    // process box
    b += `<g class="vstep" data-id="${s.id}" style="cursor:pointer"><rect x="${x}" y="${boxY}" width="${boxW}" height="${boxH}" fill="${P.node}" stroke="${isBn ? P.red : P.stroke}" stroke-width="${isBn ? 3 : 1.6}"/>`;
    b += textLines(x + boxW / 2, boxY + 26, wrapText(s.name, 20).slice(0, 2), { fill: P.ink, fs: 12, weight: 600 });
    const lab = val(s.f.labor); b += T(x + boxW / 2, boxY + 56, lab == null ? 'Operators: NYC' : `Operators: ${fmt(lab, 1)}`, { fs: 10, c: lab == null ? P.amber : P.muted });
    if (isBn) b += `<rect x="${x + boxW - 76}" y="${boxY - 18}" width="76" height="16" rx="8" fill="${P.red}"/>${T(x + boxW - 38, boxY - 6, 'BOTTLENECK', { fs: 9, w: 700, c: '#FFFFFF' })}`;
    b += `</g>`;
    // data box
    const rows = [['C/T', vsmVal(s.f.cycleTime, 's')], ['C/O', vsmVal(s.f.changeover, 'min')], ['Uptime', vsmVal(s.f.uptime, '%')], ['OEE', vsmVal(s.f.oee, '%')], ['Scrap', vsmVal(s.f.scrap, '%')], ['Eff. C/T', r.ect && r.ect.v != null ? fmt(r.ect.v, 2) + ' s' : 'NYC'], ['P/T', vsmVal(s.f.processTime, 'min')]];
    b += `<rect x="${x}" y="${boxY + boxH}" width="${boxW}" height="${dataH}" fill="${P.soft2}" stroke="${P.stroke}" stroke-width="1"/>`;
    rows.forEach((rw, k) => { const yy = boxY + boxH + 17 + k * 17; b += T(x + 8, yy, rw[0], { a: 'start', c: P.muted }) + T(x + boxW - 8, yy, rw[1], { a: 'end', c: rw[1] === 'NYC' ? P.amber : P.ink, w: rw[1] === 'NYC' ? 600 : 400 }); });
    // kaizen bursts
    const opps = (opts.opps || []).filter((o) => o.stepId === s.id);
    if (opps.length && key === 'future') { const kx = x + boxW - 6, ky = boxY - 34; const pts = []; for (let k = 0; k < 16; k++) { const rr = k % 2 ? 9 : 17, a = (k * Math.PI) / 8; pts.push(`${(kx + rr * Math.cos(a)).toFixed(1)},${(ky + rr * Math.sin(a)).toFixed(1)}`); } b += `<polygon points="${pts.join(' ')}" fill="${P.amber}" stroke="${P.stroke}" stroke-width="0.8"><title>${esc(opps.map((o) => o.desc).join(' | '))}</title></polygon>${T(kx, ky + 4, String(opps.length), { fs: 11, w: 700, c: '#FFFFFF' })}`; }
    // timeline
    const q = r.queue, pt = val(s.f.processTime);
    ladder += ` H${x - 2} V${lo} H${x + boxW} V${hi}`;
    b += T(x - 40, hi - 8, q && q.v != null ? fmt(q.v, 0) + ' min' : 'NYC', { fs: 10, c: q && q.v != null ? P.ink : P.amber, w: 600 });
    b += T(x + boxW / 2, lo + 16, pt == null ? 'NYC' : fmt(pt, 1) + ' min', { fs: 10, c: pt == null ? P.amber : s.vaClass === 'VA' ? P.green : P.muted, w: 600 });
  });
  b += `<path d="${ladder}" fill="none" stroke="${P.stroke}" stroke-width="1.6"/>`;
  b += T(x0 - 80, hi - 22, 'Queue (wait) time', { a: 'start', c: P.muted, fs: 10 }) + T(x0 - 80, lo + 34, 'Processing time', { a: 'start', c: P.muted, fs: 10 });
  // summary
  const sx = cx - 10, sy = tlY - 40;
  const L = (lbl, r, f) => [lbl, r && r.v != null ? f(r.v) + (r.s === 'NYC' ? ' (incomplete)' : r.s === 'EST' ? ' (est.)' : '') : 'NYC'];
  const sum = [L('Lead time', calc.leadTime, (v) => fmt(v / 60, 1) + ' hr'), L('Value-added', calc.vaTime, (v) => fmt(v, 1) + ' min'), L('PCE', calc.pce, (v) => pct(v, 2)), L('Takt', calc.takt, (v) => fmt(v, 2) + ' s'), L('Bottleneck C/T', calc.bnECT, (v) => fmt(v, 2) + ' s')];
  b += `<rect x="${sx}" y="${sy}" width="250" height="${sum.length * 22 + 34}" fill="${P.node}" stroke="${P.stroke}" stroke-width="1.6"/>${T(sx + 12, sy + 20, key === 'future' ? 'FUTURE STATE TOTALS' : 'CURRENT STATE TOTALS', { a: 'start', w: 700, fs: 11, c: P.accent })}`;
  sum.forEach((r, k) => (b += T(sx + 12, sy + 42 + k * 22, r[0], { a: 'start', c: P.muted }) + T(sx + 238, sy + 42 + k * 22, r[1], { a: 'end', w: 600, c: r[1] === 'NYC' ? P.amber : P.ink })));
  b += T(x0 - 80, h - 24, 'NYC = Not Yet Collected. Values marked (est.) include estimates; (incomplete) means some inputs are missing.', { a: 'start', c: P.muted, fs: 10 });
  b += demoWatermark(P, w, h, opts.demo);
  return { svg: svgWrap(w, h, b, P, `${line.name} — value stream map (${key} state)`), w, h };
}

/* ---------------- Spaghetti diagram ---------------- */
function svgSpaghetti(line, key, P, opts = {}) {
  const S = lineState(line, key), L = S.layout, k = 3, pad = 40;
  const w = L.width * k + pad * 2, h = L.height * k + pad * 2 + 70;
  const X = (x) => pad + x * k, Y = (y) => pad + y * k;
  let markers = '';
  Object.entries(ROUTE_CATS).forEach(([c, d]) => (markers += `<marker id="m-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${d.color}"/></marker>`));
  let b = arrowDefs(P, markers);
  for (let x = 0; x <= L.width; x += 10) b += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(L.height)}" stroke="${x % 50 ? P.grid : P.grid2}"/>`;
  for (let y = 0; y <= L.height; y += 10) b += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(L.width)}" y2="${Y(y)}" stroke="${y % 50 ? P.grid : P.grid2}"/>`;
  b += `<rect x="${X(0)}" y="${Y(0)}" width="${L.width * k}" height="${L.height * k}" fill="none" stroke="${P.line}" stroke-width="2"/>`;
  L.zones.forEach((z) => {
    const sel = opts.selected === z.id;
    b += `<g class="zone" data-id="${z.id}" style="cursor:move"><rect x="${X(z.x)}" y="${Y(z.y)}" width="${z.w * k}" height="${z.h * k}" fill="${z.color}" fill-opacity="0.12" stroke="${sel ? P.sel : z.color}" stroke-width="${sel ? 3 : 1.4}"/>` +
      textLines(X(z.x + z.w / 2), Y(z.y + z.h / 2), wrapText(z.name, Math.max(8, Math.floor(z.w / 3.2))), { fill: P.ink, fs: 11, lh: 13, weight: 600 }) + `</g>`;
  });
  const calc = calcState(line, key);
  (S.routes || []).forEach((r, i) => {
    const c = ROUTE_CATS[r.cat] || ROUTE_CATS.walk, sel = opts.selected === r.id;
    const pts = r.points.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    b += `<g class="route" data-id="${r.id}" style="cursor:pointer"><polyline points="${pts}" fill="none" stroke="transparent" stroke-width="14"/><polyline points="${pts}" fill="none" stroke="${c.color}" stroke-width="${sel ? 5 : 3}" stroke-opacity="${sel ? 1 : 0.85}" stroke-linejoin="round" marker-end="url(#m-${r.cat})"/>`;
    const p0 = r.points[0]; b += `<circle cx="${X(p0[0])}" cy="${Y(p0[1])}" r="9" fill="${c.color}"/><text x="${X(p0[0])}" y="${Y(p0[1]) + 4}" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">${i + 1}</text></g>`;
  });
  if (opts.draft && opts.draft.length) b += `<polyline points="${opts.draft.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="${P.sel}" stroke-width="3" stroke-dasharray="6 4"/>` + opts.draft.map((p) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${P.sel}"/>`).join('');
  // legend + scale
  const ly = Y(L.height) + 30; let lx = X(0);
  Object.entries(ROUTE_CATS).forEach(([c, d]) => { const t = calc.travelTotals[c]; b += `<line x1="${lx}" y1="${ly}" x2="${lx + 26}" y2="${ly}" stroke="${d.color}" stroke-width="4"/><text x="${lx + 32}" y="${ly + 4}" font-size="11" fill="${P.ink}">${esc(d.label)}${t ? ` — ${fmt(t.distShift, 0)} ft/shift` : ''}</text>`; lx += 250; });
  b += `<line x1="${X(0)}" y1="${ly + 22}" x2="${X(50)}" y2="${ly + 22}" stroke="${P.ink}" stroke-width="2"/><text x="${X(52)}" y="${ly + 26}" font-size="10" fill="${P.muted}">50 ft (layout scale: grid = 10 ft)</text>`;
  b += `<text x="${X(L.width)}" y="${ly + 26}" text-anchor="end" font-size="10" fill="${P.amber}">${esc(L.note || '')}</text>`;
  b += demoWatermark(P, w, h, opts.demo);
  return { svg: svgWrap(w, h, b, P, `${line.name} — spaghetti diagram (${key} state)`), w, h, X, Y, k, pad };
}

/* ---------------- Swimlane ---------------- */
function svgSwim(line, key, P, opts = {}) {
  const S = lineState(line, key), items = S.swim || [];
  const laneH = 92, labW = 130, colW = 175, top = 30;
  const cols = Math.max(6, ...items.map((i) => i.col + 1));
  const w = labW + cols * colW + 30, h = top + DEPTS.length * laneH + 70;
  let b = arrowDefs(P);
  DEPTS.forEach((d, i) => {
    const y = top + i * laneH;
    b += `<rect x="0" y="${y}" width="${w}" height="${laneH}" fill="${i % 2 ? P.soft2 : P.bg}" stroke="${P.grid2}"/><rect x="0" y="${y}" width="${labW}" height="${laneH}" fill="${P.soft}" stroke="${P.grid2}"/><circle cx="16" cy="${y + laneH / 2}" r="5" fill="${DEPT_COLORS[d]}"/>${textLines(72, y + laneH / 2, [d], { fill: P.ink, fs: 12, weight: 600 })}`;
  });
  const pos = (it) => ({ x: labW + it.col * colW + 18, y: top + DEPTS.indexOf(it.lane) * laneH + 19, w: 140, h: 54 });
  let handoffs = 0;
  items.forEach((it) => (it.next || []).forEach((nid) => {
    const t = items.find((x) => x.id === nid); if (!t) return;
    const a = pos(it), c = pos(t);
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = c.x, y2 = c.y + c.h / 2, mx = Math.min(x2 - 12, x1 + 16);
    const cross = it.lane !== t.lane; if (cross) handoffs++;
    b += `<path d="M${x1},${y1} H${mx} V${y2} H${x2 - 1}" fill="none" stroke="${cross ? P.accent : P.line}" stroke-width="${cross ? 1.8 : 1.4}" ${cross ? 'stroke-dasharray="5 3"' : ''} marker-end="url(#ah)"/>`;
  }));
  items.forEach((it) => {
    const p = pos(it), flagged = Object.values(it.flags || {}).some(Boolean), sel = opts.selected === it.id;
    const st = sel ? P.sel : flagged ? P.red : P.stroke, sw = sel || flagged ? 2.6 : 1.4;
    let shape;
    if (it.kind === 'decision') shape = `<polygon points="${p.x + p.w / 2},${p.y - 4} ${p.x + p.w},${p.y + p.h / 2} ${p.x + p.w / 2},${p.y + p.h + 4} ${p.x},${p.y + p.h / 2}" fill="${P.node}" stroke="${st}" stroke-width="${sw}"/>`;
    else if (it.kind === 'delay') shape = `<path d="M${p.x},${p.y} H${p.x + p.w - 27} A27,27 0 0 1 ${p.x + p.w - 27},${p.y + p.h} H${p.x} Z" fill="${P.node}" stroke="${st}" stroke-width="${sw}"/>`;
    else shape = `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${it.kind === 'handoff' ? 14 : 4}" fill="${P.node}" stroke="${st}" stroke-width="${sw}"/>` + (it.kind === 'approval' ? `<circle cx="${p.x + p.w - 10}" cy="${p.y + 10}" r="6" fill="none" stroke="${P.green}" stroke-width="1.5"/><path d="M${p.x + p.w - 13},${p.y + 10} l2,2 l4,-4" stroke="${P.green}" stroke-width="1.5" fill="none"/>` : '');
    let badges = ''; let bx = p.x;
    Object.entries(it.flags || {}).forEach(([k2, on]) => { if (!on) return; const lbl = { duplicate: 'DUP', unnecessary: 'APPR', delay: 'WAIT', gap: 'GAP' }[k2]; badges += `<rect x="${bx}" y="${p.y + p.h + 3}" width="36" height="14" rx="7" fill="${k2 === 'gap' ? P.amber : P.red}"/><text x="${bx + 18}" y="${p.y + p.h + 13}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">${lbl}<title>${esc(SWIM_FLAGS[k2])}</title></text>`; bx += 39; });
    b += `<g class="swim" data-id="${it.id}" style="cursor:move">${shape}${textLines(p.x + p.w / 2, p.y + p.h / 2, wrapText(it.label, 19), { fill: P.ink, fs: 11, lh: 13 })}${badges}</g>`;
  });
  const flagged = items.filter((i) => Object.values(i.flags || {}).some(Boolean)).length, approvals = items.filter((i) => i.kind === 'approval').length;
  b += `<text x="${labW}" y="${h - 22}" font-size="11" fill="${P.muted}">Cross-department handoffs: ${handoffs}   ·   Approvals: ${approvals}   ·   Flagged items: ${flagged}   ·   DUP = duplicated work, APPR = unnecessary approval, WAIT = delay, GAP = communication gap</text>`;
  b += demoWatermark(P, w, h, opts.demo);
  return { svg: svgWrap(w, h, b, P, `${line.name} — swimlane (${key} state)`), w, h, stats: { handoffs, approvals, flagged }, pos, laneH, labW, colW, top };
}

/* =====================================================================
   UI: app shell, views, editors
   ===================================================================== */
let PRJ = null;
const UI = { tab: 'dashboard', state: 'current', sel: null, selType: null, zoom: {}, connectFrom: null, spMode: 'select', drawCat: 'walk', draft: [], matrix: false, actFilter: 'All', confirm: null };
const TABS = [
  ['dashboard', 'Dashboard'], ['flow', 'Process Flow'], ['vsm', 'Value Stream'], ['spaghetti', 'Spaghetti'], ['swimlane', 'Swimlane'], ['pam', 'Activity Map'],
  ['data', 'Step Data'], ['opps', 'Waste & Opportunities'], ['actions', 'Actions'], ['finance', 'Finance Validation'], ['compare', 'Current vs Future'],
  ['checklist', 'Floor-Walk Checklist'], ['formulas', 'Formulas & Sources'], ['io', 'Lines & Export'],
];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LINE = () => PRJ.lines.find((l) => l.id === PRJ.activeLine) || PRJ.lines[0];
const ST = () => lineState(LINE(), UI.state);
const PAL = () => PALETTES[isDark() ? 'dark' : 'light'];
function isDark() { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }

function chip(s, text) { const c = s === 'VER' ? 'ok' : s === 'EST' ? 'est' : 'nyc'; return `<span class="chip ${c}">${esc(text || statusLabel(s))}</span>`; }
function fieldChip(f) { const s = fstat(f); return `<span class="chip ${s === 'VER' ? 'ok' : s === 'EST' ? 'est' : 'nyc'}">${s === 'NYC' ? NYC : STATUS[s]}</span>`; }
function opt(list, cur) { return list.map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`; }).join(''); }
function toast(msg, kind = '') { const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind; clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = 'toast'), 3200); }
function stepName(id) { for (const l of PRJ.lines) for (const k of ['current', 'future']) { const s = l[k] && l[k].steps.find((x) => x.id === id); if (s) return s.name; } return '—'; }

function changed(rer = true) { PRJ.updated = new Date().toISOString(); Store.schedule(); if (rer) render(); }

/* ---------------- shell ---------------- */
function renderShell() {
  const l = LINE();
  $('#lineSel').innerHTML = opt(PRJ.lines.map((x) => [x.id, x.name]), l.id);
  $('#stateSel').innerHTML = opt([['current', 'Current state'], ['future', l.future ? 'Future state' : 'Future state (not created)']], UI.state);
  $('#demoBadge').hidden = !PRJ.demo;
  $('#nav').innerHTML = TABS.map(([k, t]) => `<button type="button" class="tab${UI.tab === k ? ' on' : ''}" data-tab="${k}" id="tab-${k}">${t}</button>`).join('');
}
function render() {
  renderShell();
  const v = $('#view');
  const fn = VIEWS[UI.tab] || VIEWS.dashboard;
  if (UI.state === 'future' && !LINE().future && !['dashboard', 'io', 'formulas', 'opps', 'actions', 'finance', 'checklist', 'compare'].includes(UI.tab)) v.innerHTML = noFuture();
  else v.innerHTML = fn();
  afterRender();
  renderPanel();
}
function noFuture() { return `<section class="card empty"><h2>No future state yet for ${esc(LINE().name)}</h2><p>Build the future state from a copy of the current state, then change the steps, layout and data to show the proposed process.</p><button class="btn primary" data-action="createFuture" id="btnCreateFuture">Create future state from current</button></section>`; }

/* ---------------- dashboard ---------------- */
function kpiTile(label, r, f, unit, note) {
  const v = r && r.v != null ? f(r.v) : 'NYC';
  return `<div class="kpi"><div class="kpi-l">${esc(label)}</div><div class="kpi-v${v === 'NYC' ? ' nycv' : ''}">${esc(v)}${v !== 'NYC' && unit ? `<small>${esc(unit)}</small>` : ''}</div>${chip(r ? r.s : 'NYC', r && r.s === 'NYC' && r.v != null ? 'Partial' : undefined)}${note ? `<div class="kpi-n">${esc(note)}</div>` : ''}</div>`;
}
const VIEWS = {};
VIEWS.dashboard = function () {
  const l = LINE(), c = calcState(l, UI.state === 'future' && l.future ? 'future' : 'current'), comp = c.completeness;
  const bn = c.bottleneck;
  const tiles = [
    kpiTile('Total lead time', c.leadTime, (v) => fmt(v / 60, 1), 'hr'),
    kpiTile('Value-added time', c.vaTime, (v) => fmt(v, 1), 'min'),
    kpiTile('Process cycle efficiency', c.pce, (v) => pct(v, 2), ''),
    kpiTile('Takt time', c.takt, (v) => fmt(v, 2), 's/unit'),
    kpiTile('Bottleneck', c.bnECT, (v) => fmt(v, 2), 's', bn ? bn.name + (c.ctCoverage.measured < c.ctCoverage.total ? ` · provisional (${c.ctCoverage.measured}/${c.ctCoverage.total} steps timed)` : '') : 'No cycle times collected'),
    kpiTile('Line capacity', c.capacity, (v) => fmt(v, 0), l.unit + '/hr'),
    kpiTile('Rolled throughput yield', c.rty, (v) => pct(v, 1), ''),
    kpiTile('Labor productivity', c.productivity, (v) => fmt(v, 1), l.unit + '/labor-hr'),
    kpiTile('Changeover time', c.coHours, (v) => fmt(v, 1), 'hr/week'),
    kpiTile('Travel labor', c.travelHrs, (v) => fmt(v, 0), 'hr/yr'),
  ].join('');
  const opps = PRJ.opps.filter((o) => o.lineId === l.id);
  const est = opps.filter((o) => o.fin.status !== 'Validated by Finance' && o.fin.status !== 'Rejected').reduce((a, o) => a + (+o.estAnnual || 0), 0);
  const valid = opps.filter((o) => o.fin.status === 'Validated by Finance').reduce((a, o) => a + (+o.fin.validated || 0), 0);
  const acts = PRJ.actions.filter((a) => opps.some((o) => o.id === a.oppId));
  const overdue = acts.filter((a) => a.status !== 'Done' && a.due && a.due < todayISO()).length;
  const pctGot = comp.tot ? comp.got / comp.tot : 0, pctVer = comp.tot ? comp.ver / comp.tot : 0;
  return `
  <section class="head-row"><div><h1>${esc(l.name)} <span class="muted">· ${UI.state === 'future' && l.future ? 'Future state' : 'Current state'}</span></h1><p class="lede">${esc(l.notes || '')}</p></div>
  <div class="head-actions">${PRJ.demo ? '' : `<button class="btn" data-action="loadDemo" id="btnDemo1">Load demonstration data</button>`}<button class="btn primary" data-tab="checklist">Open floor-walk checklist</button></div></section>

  <div class="bar"><span class="bar-est" style="width:${(pctGot * 100).toFixed(1)}%"></span><span class="bar-ver" style="width:${(pctVer * 100).toFixed(1)}%"></span></div>
  <div class="legend"><span><i class="sw ver"></i>Verified</span><span><i class="sw est"></i>Estimate</span><span><i class="sw nyc"></i>Not Yet Collected</span></div></section>
  <section class="kpis">${tiles}</section>
  <section class="grid2">
    <div class="card"><div class="card-h"><h2>Effective cycle time by step</h2><span class="muted">vs takt time</span></div><div class="scrollx">${bnChart(l, c)}</div></div>
    <div class="card"><div class="card-h"><h2>Improvement pipeline</h2></div>
      <div class="mini-stats"><div><b>${opps.length}</b><span>opportunities</span></div><div><b>${money(est)}</b><span>estimated / yr, not validated</span></div><div><b>${money(valid)}</b><span>validated by Finance / yr</span></div><div><b class="${overdue ? 'bad' : ''}">${overdue}</b><span>overdue actions</span></div></div>
      <div class="scrollx"><table class="tbl"><thead><tr><th>Waste</th><th>Opportunity</th><th>Finance status</th></tr></thead><tbody>${opps.slice(0, 6).map((o) => `<tr><td>${esc(o.waste)}</td><td>${esc(o.desc)}</td><td>${finChip(o.fin.status)}</td></tr>`).join('') || `<tr><td colspan="3" class="muted">No opportunities yet. Add them in Waste &amp; Opportunities, or use the suggestions generated from your data.</td></tr>`}</tbody></table></div>
    </div>
  </section>`;
};
function finChip(s) { const c = s === 'Validated by Finance' ? 'ok' : s === 'Rejected' ? 'bad' : s === 'Not started' ? 'nyc' : 'est'; return `<span class="chip ${c}">${esc(s)}</span>`; }
function bnChart(l, c) {
  const P = PAL(), steps = applicable(lineState(l, c.key).steps); const rows = steps.map((s) => [s, c.steps[s.id] && c.steps[s.id].ect]);
  const max = Math.max(1, ...rows.map((r) => (r[1] && r[1].v) || 0), c.takt.v || 0) * 1.15;
  const W = 560, rh = 24, H = rows.length * rh + 40, lx = 170, cw = W - lx - 60;
  let b = '';
  rows.forEach(([s, r], i) => {
    const y = 10 + i * rh, v = r && r.v; const isBn = c.bottleneck && c.bottleneck.stepId === s.id;
    b += `<text x="${lx - 8}" y="${y + 15}" text-anchor="end" font-size="11" fill="${P.ink}">${esc(s.name)}</text>`;
    if (v != null) b += `<rect x="${lx}" y="${y + 4}" width="${((v / max) * cw).toFixed(1)}" height="15" rx="2" fill="${isBn ? P.red : r.s === 'VER' ? P.green : P.accent}"/><text x="${lx + (v / max) * cw + 5}" y="${y + 15}" font-size="10" fill="${P.muted}">${fmt(v, 2)} s</text>`;
    else b += `<text x="${lx + 4}" y="${y + 15}" font-size="10" fill="${P.amber}">Not Yet Collected</text>`;
  });
  if (c.takt.v) { const x = lx + (c.takt.v / max) * cw; b += `<line x1="${x}" y1="4" x2="${x}" y2="${H - 26}" stroke="${P.amber}" stroke-width="2" stroke-dasharray="5 3"/><text x="${x}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${P.amber}">Takt ${fmt(c.takt.v, 2)} s</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Effective cycle time by step">${b}</svg>`;
}

/* ---------------- opportunities ---------------- */
function suggestions(l) {
  const out = [], c = calcState(l, 'current'), S = l.current;
  if (c.bottleneck) out.push({ stepId: c.bottleneck.stepId, waste: 'Waiting', desc: `${c.bottleneck.name} has the highest effective cycle time (${fmt(c.bottleneck.ect.v, 2)} s)${c.takt.v ? (c.bottleneck.ect.v > c.takt.v ? ', above takt — demand at risk' : ', below takt') : ''}. Investigate downtime and changeover.` });
  let hq = null; applicable(S.steps).forEach((s) => { const q = c.steps[s.id] && c.steps[s.id].queue; if (q && q.v != null && (!hq || q.v > hq.v)) hq = { s, v: q.v }; });
  if (hq) out.push({ stepId: hq.s.id, waste: 'Inventory', desc: `Largest queue is before ${hq.s.name} (${fmt(hq.v, 0)} min of WIP). Check batch sizes and pull signals.` });
  let hs = null; applicable(S.steps).forEach((s) => { const v = val(s.f.scrap); if (v != null && (!hs || v > hs.v)) hs = { s, v }; });
  if (hs) out.push({ stepId: hs.s.id, waste: 'Defects', desc: `Highest recorded scrap is at ${hs.s.name} (${fmt(hs.v, 1)}%). Pareto the scrap causes.` });
  let hc = null; applicable(S.steps).forEach((s) => { const v = c.steps[s.id] && c.steps[s.id].coH; if (v != null && (!hc || v > hc.v)) hc = { s, v }; });

  let lr = null; (S.routes || []).forEach((r) => { const x = c.routes[r.id]; if (x.distShift != null && (!lr || x.distShift > lr.v)) lr = { r, v: x.distShift }; });

  return out.filter((sg) => !PRJ.opps.some((o) => o.lineId === l.id && o.desc === sg.desc));

  return `<section class="head-row"><div><h1>Current vs future state — ${esc(l.name)}</h1><p class="lede">Side-by-side KPIs and estimated savings. Every saving here is an estimate until Finance validates it.</p></div><div class="head-actions"><button class="btn" data-action="exportCompare">Comparison report (PDF)</button></div></section>

  ${row('Changeover (hr/week)', c.coHours, f.coHours, (v) => fmt(v, 1))}${row('Total labor (people)', c.labor, f.labor, (v) => fmt(v, 1))}${row('Travel labor (hr/yr)', c.travelHrs, f.travelHrs, (v) => fmt(v, 0))}${row('Travel labor cost ($/yr)', c.travelCost, f.travelCost, money)}
