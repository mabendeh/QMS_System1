<title>Frozen Line Skills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: plant-floor control board — sticky header with shift switch, tabbed views, slide-over editor for one person */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --surface-2:#F6F9FB; --ink:#0F1F2C; --muted:#56687A; --line:#D6E0E7;
  --accent:#0A6C96; --accent-ink:#FFFFFF; --accent-soft:#DDEEF5;
  --l0:#E7ECF0; --l0t:#6B7C8A; --l1:#FCEFC7; --l1t:#7A5A00; --l2:#FAD9B5; --l2t:#86400B; --l3:#BFE6C7; --l3t:#145C24; --l4:#2F7D3E; --l4t:#FFFFFF;
  --gap:#C0362C; --gap-soft:#FBE3E0; --warn:#9A5B00; --warn-soft:#FFF0D1; --ok:#22713A; --ok-soft:#DDF2E2;
  --shadow:0 1px 2px rgba(15,31,44,.06),0 6px 24px rgba(15,31,44,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B141B; --surface:#121E27; --surface-2:#172631; --ink:#E4ECF2; --muted:#93A6B5; --line:#243541;
  --accent:#4DB2DD; --accent-ink:#06202C; --accent-soft:#123446;
  --l0:#22313C; --l0t:#8FA2B0; --l1:#4A3D12; --l1t:#F3D57A; --l2:#4F2E12; --l2t:#F6B57A; --l3:#1D4A2A; --l3t:#9BE0AC; --l4:#3E9C52; --l4t:#06180B;
  --gap:#FF7A6E; --gap-soft:#3D1A17; --warn:#F2B451; --warn-soft:#3A2B10; --ok:#7BD293; --ok-soft:#163521;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B141B; --surface:#121E27; --surface-2:#172631; --ink:#E4ECF2; --muted:#93A6B5; --line:#243541;
  --accent:#4DB2DD; --accent-ink:#06202C; --accent-soft:#123446;
  --l0:#22313C; --l0t:#8FA2B0; --l1:#4A3D12; --l1t:#F3D57A; --l2:#4F2E12; --l2t:#F6B57A; --l3:#1D4A2A; --l3t:#9BE0AC; --l4:#3E9C52; --l4t:#06180B;
  --gap:#FF7A6E; --gap-soft:#3D1A17; --warn:#F2B451; --warn-soft:#3A2B10; --ok:#7BD293; --ok-soft:#163521;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;margin-top:-2px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:15.5px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--gap);color:#fff;font-size:12px;line-height:18px;text-align:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl{font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

main{padding-block:20px 60px;display:grid;gap:20px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner b{color:var(--warn)}
.banner .sp{flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--gap);border-color:color-mix(in srgb,var(--gap) 40%,transparent)}
.btn.danger.armed{background:var(--gap);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>h2,.card .ch{display:flex;align-items:baseline;gap:10px;justify-content:space-between;margin:0;padding:14px 18px 0;font-family:var(--f-display);font-size:18px;font-weight:700}
.card .ch h2{margin:0;font-size:18px}
.card .sub{color:var(--muted);font-size:13px;font-weight:400;font-family:var(--f-body)}
.cb{padding:12px 18px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.kpi{padding:16px 18px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.kpi .v small{font-size:18px;color:var(--muted);font-weight:600}
.kpi .d{color:var(--muted);font-size:13px}
.kpi.bad .v{color:var(--gap)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--l0);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 48px;gap:12px;align-items:center;font-size:14px}
.bar .t{height:14px;background:var(--l0);border-radius:4px;position:relative;overflow:hidden}
.bar .t i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar b{text-align:right;font-family:var(--f-display);font-size:16px}
.axis{display:grid;grid-template-columns:minmax(120px,190px) 1fr 48px;gap:12px;font-size:11.5px;color:var(--muted)}
.axis div:nth-child(2){display:flex;justify-content:space-between}

/* heatmap */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.heat td,.heat th{padding:6px;text-align:center;font-size:13.5px}
.heat th{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:13px}
.heat td:first-child,.heat th:first-child{text-align:left;white-space:nowrap}
.heat .c{border-radius:6px;padding:8px 4px;font-weight:600;font-family:var(--f-display);font-size:15px}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .n{font-weight:600}
.li .m{color:var(--muted);font-size:13px}
button.li{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;padding-inline:0}
button.li:first-child{border-top:0}
button.li:hover .n{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.risk{background:var(--gap-soft);color:var(--gap)} .pill.gap{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.na{background:var(--l0);color:var(--l0t)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.low{background:var(--gap-soft);color:var(--gap);border-color:transparent;font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.toolbar .grow{flex:1}

/* people cards */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.pc{display:grid;gap:8px;padding:14px 16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pc:hover{border-color:var(--accent)}
.pc .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.pc .nm{font-weight:600;font-size:16px}
.pc .rl{color:var(--muted);font-size:13px}
.pc .pct{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.pc .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pc .foot b.bad{color:var(--gap)}

/* matrix grid */
.mx{border-collapse:separate;border-spacing:2px;font-size:12.5px}
.mx th{font-family:var(--f-display);font-weight:600;color:var(--muted)}
.mx thead th.sk{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;text-align:left;padding:4px 0;font-size:12px;font-weight:500;white-space:nowrap}
.mx thead th.cat{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px;border-bottom:3px solid var(--accent);white-space:nowrap}
.mx td.p{position:sticky;left:0;background:var(--surface);z-index:1;white-space:nowrap;padding-right:10px;text-align:left}
.mx td.p button{border:0;background:none;padding:0;font-weight:600;text-align:left}
.mx td.p button:hover{color:var(--accent)}
.mx td.p span{display:block;color:var(--muted);font-size:11.5px}
.mx td.v{width:26px;min-width:26px;height:26px;text-align:center;border-radius:4px;font-weight:700}
.mx td.v.gapc{box-shadow:inset 0 0 0 2px var(--gap)}
.mx td.v.nr{opacity:.45}

.lv0{background:var(--l0);color:var(--l0t)} .lv1{background:var(--l1);color:var(--l1t)} .lv2{background:var(--l2);color:var(--l2t)} .lv3{background:var(--l3);color:var(--l3t)} .lv4{background:var(--l4);color:var(--l4t)}

.legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.legend i.g{background:transparent;box-shadow:inset 0 0 0 2px var(--gap)}

/* skill rows */
.sk-row{display:grid;grid-template-columns:52px 1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sk-row:first-child{border-top:0}
.sk-id{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}
.sk-cov{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sk-cov .sh{min-width:58px;text-align:center;padding:3px 6px;border-radius:6px;background:var(--surface-2);font-size:12.5px}
.sk-cov .sh b{font-family:var(--f-display);font-size:15px}
.sk-cov .sh.low{background:var(--gap-soft);color:var(--gap)}
details.sk>summary{list-style:none;cursor:pointer}
details.sk>summary::-webkit-details-marker{display:none}
details.sk[open]{background:var(--surface-2);margin-inline:-18px;padding-inline:18px}
.sk-more{grid-column:2/-1;display:grid;gap:8px;padding-bottom:6px;font-size:14px}
.sk-more p{margin:0}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who span{padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:600}

/* training */
.tp{display:grid;gap:12px}
.tp-p{padding:0}
.tp-p .ch{padding-bottom:4px}
.tp-i{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 18px;border-top:1px solid var(--line);align-items:center}
.tp-i .n{font-weight:600}
.tp-i .m{color:var(--muted);font-size:13px}
.step{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700}
.step i{font-style:normal;width:24px;height:22px;border-radius:5px;display:inline-grid;place-items:center;font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,22,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:grid;gap:10px}
.dh .row{display:flex;gap:12px;align-items:center}
.dh h2{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.db{overflow-y:auto;padding:16px 18px 40px;display:grid;gap:16px;align-content:start}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;color:var(--ink)}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 2px;font-family:var(--f-display);font-weight:700;font-size:16px}
.cat-h span{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.er{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;border-left:4px solid var(--line)}
.er.is-gap{border-left-color:var(--gap)}
.er.is-ok{border-left-color:var(--ok)}
.er .n{font-weight:600;font-size:14.5px}
.er .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.er .m .need{font-weight:700;color:var(--ink)}
.er .m .g{color:var(--gap);font-weight:700}
.lvls{display:flex;gap:4px}
.lvls button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted)}
.lvls button[aria-pressed="true"].b0{background:var(--l0);color:var(--l0t);border-color:var(--l0t)}
.lvls button[aria-pressed="true"].b1{background:var(--l1);color:var(--l1t);border-color:var(--l1t)}
.lvls button[aria-pressed="true"].b2{background:var(--l2);color:var(--l2t);border-color:var(--l2t)}
.lvls button[aria-pressed="true"].b3{background:var(--l3);color:var(--l3t);border-color:var(--l3t)}
.lvls button[aria-pressed="true"].b4{background:var(--l4);color:var(--l4t);border-color:var(--l4)}
.lvls button.req{position:relative}
.lvls button.req::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--ink)}
.lvls button:disabled{cursor:default}
.scale{display:grid;gap:6px;font-size:13.5px}
.scale div{display:grid;grid-template-columns:30px 130px 1fr;gap:10px;align-items:center}
.scale i{font-style:normal;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;font-size:14px}
.help summary{cursor:pointer;font-weight:600}
@media (max-width:560px){
  .bar,.axis{grid-template-columns:100px 1fr 40px}
  .lvls button{width:36px;height:38px}
  .sk-row{grid-template-columns:44px 1fr}
  .sk-cov{grid-column:1/-1;justify-content:flex-start}
  .kpi .v{font-size:34px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand"><div class="mark">CHG</div><div><h1>Frozen Line Skills</h1><small>C.H. Guenther · frozen production team · no baking</small></div></div>

</header>

<main class="wrap" id="main">

<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ======================= reference data ======================= */
const ROLES=[["PA","Production Associate"],["BT","Batching / Ingredient Room"],["MX","Mixer Operator"],["FO","Forming / Sheeting Operator"],["FR","Freezer Operator"],["PK","Packaging Operator"],["WH","Palletizer / Freezer Warehouse"],["LL","Line Lead"],["SV","Production Supervisor"]];
const ROLE_NAME=Object.fromEntries(ROLES);
const SHIFTS=["1st","2nd","3rd"];
const MIN_PER_SHIFT=2;
const LEVELS=[[0,"Not trained","Has not started training."],[1,"In training","Learning. Works only with a trainer beside them."],[2,"Can do with help","Does the task but still needs support or checks."],[3,"Qualified","Works alone to standard. Signed off by trainer and supervisor."],[4,"Expert / Trainer","Troubleshoots, trains others and signs off levels 1–3."]];
// [id, skill, what Qualified looks like, how verified, required level per role: PA BT MX FO FR PK WH LL SV]
const CATS=[
["Food Safety & Quality","FS",[
["FS01","GMPs & personal hygiene","Follows hairnet, jewelry, handwashing, glove and smock rules without reminders; corrects others.","Quiz + GMP observation",[3,3,3,3,3,3,3,4,4]],
["FS02","Allergen control & changeover","Knows the allergens on their line; performs and documents allergen clean and verification.","Quiz + observed changeover (QA verifies)",[2,3,3,3,2,3,2,4,3]],
["FS03","HACCP & CCP awareness","Names the CCPs on their line, the critical limit, and what to do when a limit is missed.","Quiz + verbal check (QA verifies)",[2,2,2,2,3,3,2,3,3]],
["FS04","Foreign material control","Applies glass/brittle plastic, hard plastic, tool and blade rules; reports damage at once.","Observation",[3,3,3,3,3,3,3,4,3]],
["FS05","Metal detector / X-ray checks","Runs Fe / Non-Fe / SS test pieces on time, confirms reject works, holds product to last good check on failure.","3 observed checks + records (QA verifies)",[0,0,0,0,0,3,0,4,3]],
["FS06","Food defense awareness","Spots and reports unknown people, tampering signs and unsecured ingredients.","Quiz",[2,2,2,2,2,2,2,3,3]],
["FS07","Hold & non-conforming product","Tags, separates and logs suspect product; never releases held product without QA.","Observation + record review",[2,3,3,3,3,3,3,4,4]],
["FS08","Good documentation practices","Records in real time, in ink, single-line corrections with initials and date; no pre-filling.","Record review",[2,3,3,3,3,3,3,4,4]],
["FS09","Environmental monitoring & zoning","Follows traffic flow, color-coded tools and zone rules; understands Listeria control in a frozen plant.","Quiz + observation",[2,2,2,2,3,2,2,3,3]],
["FS10","Pre-op inspection & clean-as-you-go","Completes the pre-op checklist for their area and keeps it clean during the run.","Observation + pre-op record",[3,3,3,3,3,3,3,4,3]]]],

const SK=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
const ROLE_IDX=Object.fromEntries(ROLES.map((r,i)=>[r[0],i]));

/* ======================= sample team (not saved) ======================= */
function sampleTeam(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const plan=[["PK","1st"],["PK","2nd"],["PK","3rd"],["FR","1st"],["FR","2nd"],["MX","1st"],["MX","3rd"],["FO","2nd"],["BT","1st"],["WH","2nd"],["PA","3rd"],["LL","1st"],["LL","2nd"],["SV","1st"]];
  return plan.map(([role,shift],i)=>{
    const levels={};SKILLS.forEach(s=>{const q=s.req[ROLE_IDX[role]];const r=rnd();let v=q;
      if(q>0&&r<.16)v=q-1-(r<.04?1:0);else if(r>.86&&q<4)v=q+1;else if(q===0&&r>.7)v=1;
      levels[s.id]=Math.max(0,Math.min(4,v))});
    return{id:"sample"+i,name:"Sample "+String.fromCharCode(65+i),empId:"S-"+String(101+i),role,shift,area:"Line "+(1+i%2),levels}});
}

/* ======================= helpers ======================= */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lv=(p,id)=>{const v=p.levels&&p.levels[id];return typeof v==="number"?v:0};
const rq=(p,id)=>{const i=ROLE_IDX[p.role];return i==null?0:SK[id].req[i]};
const pct=(a,b)=>b?Math.round(a/b*100):0;
function stats(p){let need=0,met=0;const gaps=[];SKILLS.forEach(s=>{const r=rq(p,s.id);if(r>0){need++;if(lv(p,s.id)>=r)met++;else gaps.push(s)}});return{need,met,gaps,pct:pct(met,need)}}
const inShift=p=>S.shift==="all"||p.shift===S.shift;
const visiblePeople=()=>S.people.filter(inShift).sort((a,b)=>a.name.localeCompare(b.name));
const tone=v=>v>=95?"var(--ok)":v>=80?"var(--warn)":"var(--gap)";
function coverage(s){
  const by={};SHIFTS.forEach(sh=>by[sh]=0);let total=0,trainers=0,needed=false;const staffed={};
  S.people.forEach(p=>{staffed[p.shift]=true;if(rq(p,s.id)>0)needed=true;const v=lv(p,s.id);if(v>=3){total++;if(by[p.shift]!=null)by[p.shift]++}if(v===4)trainers++});
  let status="ok";if(!needed)status="na";else if(total<=1)status="risk";else if(SHIFTS.some(sh=>staffed[sh]&&by[sh]<MIN_PER_SHIFT))status="gap";
  return{by,total,trainers,status,staffed};
}
const STATUS_TXT={risk:"High risk",gap:"Short on a shift",ok:"OK",na:"Not needed"};

  const worst=ppl.map(p=>({p,st:stats(p)})).filter(x=>x.st.gaps.length).sort((a,b)=>b.st.gaps.length-a.st.gaps.length).slice(0,6);

  </section>

      <div class="axis"><span></span><div><span>0%</span><span>50%</span><span>100%</span></div><span></span></div></div></div></div>
    <div class="card"><div class="ch"><h2>Shift coverage</h2><span class="sub">% of required skills met, per shift</span></div>

  const order={risk:0,gap:1,ok:2,na:3};

    <div class="legend"><span><span class="pill risk">High risk</span> 0–1 qualified people in total</span><span><span class="pill gap">Short on a shift</span> fewer than ${MIN_PER_SHIFT} qualified on a staffed shift</span><span><span class="pill ok">OK</span></span></div>`;
  const rows=list.map(s=>({s,c:coverage(s)})).sort((a,b)=>order[a.c.status]-order[b.c.status]||a.s.id.localeCompare(b.s.id));
  return tb+`<div class="card"><div class="cb">${rows.map(({s,c})=>{
    const who=S.people.filter(p=>lv(p,s.id)>=1).sort((a,b)=>lv(b,s.id)-lv(a,s.id));
    return `<details class="sk" ${S.open===s.id?"open":""} data-sk="${s.id}"><summary class="sk-row"><span class="sk-id">${s.id}</span><span><b>${esc(s.name)}</b><br><span class="m" style="color:var(--muted);font-size:13px">${esc(s.cat)}</span></span>
      <span class="sk-cov"><span class="pill ${c.status}">${STATUS_TXT[c.status]}</span>${SHIFTS.map(sh=>`<span class="sh ${c.staffed[sh]&&c.status!=="na"&&c.by[sh]<MIN_PER_SHIFT?"low":""}">${sh} <b>${c.by[sh]}</b></span>`).join("")}<span class="sh">Trainers <b>${c.trainers}</b></span></span></summary>
      <div class="sk-row" style="border-top:0;padding-top:0"><span></span><div class="sk-more">
        <p><span class="lbl">Qualified looks like</span><br>${esc(s.qual)}</p>
        <p><span class="lbl">How it's verified</span><br>${esc(s.verify)}</p>
        <p><span class="lbl">Required by</span><br>${ROLES.filter((r,i)=>s.req[i]>0).map((r,i)=>`${esc(r[1])} (${s.req[ROLE_IDX[r[0]]]})`).join(" · ")||"No role"}</p>
        <div><span class="lbl">Who has it</span><div class="who" style="margin-top:4px">${who.length?who.map(p=>`<span class="lv${lv(p,s.id)}">${esc(p.name)} · ${lv(p,s.id)}</span>`).join(""):`<span style="color:var(--muted)">No one yet</span>`}</div></div>
      </div></div></details>`}).join("")||`<div class="empty"><b>No skills match</b></div>`}</div></div>`;
}

/* ======================= training ======================= */
function trainerFor(s,p){
  const t=S.people.filter(x=>x.id!==p.id&&lv(x,s.id)===4);
  const same=t.filter(x=>x.shift===p.shift);
  return (same[0]||t[0])||null;
}
function viewTraining(){
  const ppl=visiblePeople().map(p=>({p,st:stats(p)})).filter(x=>x.st.gaps.length).sort((a,b)=>b.st.gaps.length-a.st.gaps.length);
  const total=ppl.reduce((n,x)=>n+x.st.gaps.length,0);
  const tb=`<div class="toolbar"><div class="seg" role="group" aria-label="Group by"><button data-tb="person" aria-pressed="${S.trainBy==="person"}">By person</button><button data-tb="skill" aria-pressed="${S.trainBy==="skill"}">By skill</button></div><span class="grow"></span><span style="color:var(--muted)">${total} gap${total===1?"":"s"} to close · suggested trainer = a level 4, same shift first</span></div>`;
  if(!total)return tb+`<div class="card empty"><b>Nothing to train</b>Everyone meets the levels their role needs.</div>`;
  const step=(a,b)=>`<span class="step"><i class="lv${a}">${a}</i>→<i class="lv${b}">${b}</i></span>`;
  if(S.trainBy==="person")return tb+`<div class="tp">${ppl.map(({p,st})=>`<div class="card tp-p"><div class="ch"><h2><button class="btn" data-person="${esc(p.id)}" style="border:0;padding:0;font:inherit;background:none">${esc(p.name)}</button></h2><span class="sub">${esc(ROLE_NAME[p.role]||"")} · ${esc(p.shift)} shift · ${st.pct}% ready</span></div><div style="padding-top:8px">
    ${st.gaps.map(s=>{const t=trainerFor(s,p);return `<div class="tp-i"><span class="n">${esc(s.name)} <span class="m">${s.id}</span></span>${step(lv(p,s.id),rq(p,s.id))}<span class="m">${esc(s.verify)}</span><span class="m">${t?"Trainer: "+esc(t.name)+(t.shift!==p.shift?" ("+esc(t.shift)+")":""):'<span style="color:var(--gap)">No trainer on team</span>'}</span></div>`}).join("")}</div></div>`).join("")}</div>`;
  const bySkill={};ppl.forEach(({p,st})=>st.gaps.forEach(s=>(bySkill[s.id]=bySkill[s.id]||[]).push(p)));
  const ids=Object.keys(bySkill).sort((a,b)=>bySkill[b].length-bySkill[a].length);
  return tb+`<div class="tp">${ids.map(id=>{const s=SK[id];const t=S.people.filter(x=>lv(x,id)===4);return `<div class="card tp-p"><div class="ch"><h2>${esc(s.name)}</h2><span class="sub">${id} · ${bySkill[id].length} ${bySkill[id].length===1?"person":"people"}</span></div><div style="padding-top:8px">
    ${bySkill[id].map(p=>`<div class="tp-i"><button class="n" data-person="${esc(p.id)}" style="border:0;background:none;padding:0;text-align:left">${esc(p.name)}</button>${step(lv(p,id),rq(p,id))}<span class="m">${esc(ROLE_NAME[p.role]||"")} · ${esc(p.shift)} shift</span><span class="m"></span></div>`).join("")}
    <div class="tp-i"><span class="m">Trainers: ${t.length?t.map(x=>esc(x.name)+" ("+esc(x.shift)+")").join(", "):'<span style="color:var(--gap)">none — train a trainer first</span>'}</span><span></span></div></div></div>`}).join("")}</div>`;
}

/* ======================= guide ======================= */
function viewGuide(){
  return `<div class="grid2">
  <div class="card"><div class="ch"><h2>The rating scale</h2><span class="sub">Same for every skill</span></div><div class="cb"><div class="scale">${LEVELS.map(([l,n,d])=>`<div><i class="lv${l}">${l}</i><b>${n}</b><span>${d}</span></div>`).join("")}</div>
  <p style="color:var(--muted);font-size:13.5px;margin:14px 0 0">A dot under a number in the editor marks the level that person's role needs. A red edge means they're below it.</p></div></div>
  <div class="card"><div class="ch"><h2>Using it in 4 steps</h2></div><div class="cb"><ol style="margin:0;padding-left:20px;display:grid;gap:10px">
    <li><b>Add your people.</b> Team → <i>Add team member</i>. Pick their role and shift.</li>
    <li><b>Tap their levels.</b> Open a person and tap 0–4 for each skill. It only shows the skills their role needs, unless you switch to all skills. Changes save as you tap.</li>
    <li><b>Work the training list.</b> <i>Training needed</i> lists every gap with a suggested trainer.</li>
    <li><b>Check coverage weekly.</b> The Dashboard and <i>Skills &amp; coverage</i> flag skills with too few qualified people on a shift.</li></ol></div></div>
  <div class="card"><div class="ch"><h2>Sign-off rules</h2></div><div class="cb"><ul style="margin:0;padding-left:20px;display:grid;gap:8px">
    <li>Only enter <b>3</b> after training is done, performance has been observed, and trainer and supervisor have signed.</li>
    <li><b>4</b> needs 6+ months at level 3, the On-the-job trainer skill (LL05), and supervisor approval.</li>
    <li>Allergen and CCP skills (FS02, FS03, FS05, FR03, PK03, PK04) also need QA verification.</li>
    <li>Signed training records stay in your document control system. This dashboard is the summary.</li>
    <li>Review after every new hire, transfer, new product or new equipment.</li></ul></div></div>
  <div class="card"><div class="ch"><h2>What's covered</h2><span class="sub">${SKILLS.length} skills · ${ROLES.length} roles</span></div><div class="cb"><div class="list">${CATS.map(([c,code,items])=>`<div class="li"><span class="n">${esc(c)}</span><span class="m">${items.length} skills</span></div>`).join("")}</div>
    <p style="color:var(--muted);font-size:13.5px;margin:10px 0 0">Frozen operations only: batching, mixing, forming, freezing, packaging, palletizing and cold storage. No oven or baking skills.</p></div></div></div>`;
}

/* ======================= drawer: person editor ======================= */
let drawer=null; // {mode:'new'|'edit', id}
function openPerson(id){drawer={mode:"edit",id};S.armed=null;renderDrawer()}
function openNew(){drawer={mode:"new"};renderDrawer()}
function closeDrawer(){drawer=null;document.getElementById("drawerHost").innerHTML=""}
function renderDrawer(keepScroll){
  const host=document.getElementById("drawerHost");
  if(!drawer){host.innerHTML="";return}
  const prevScroll=keepScroll&&host.querySelector(".db")?host.querySelector(".db").scrollTop:0;
  const p=drawer.mode==="edit"?S.people.find(x=>x.id===drawer.id):null;
  if(drawer.mode==="edit"&&!p){closeDrawer();return}
  const v=p||{name:"",empId:"",role:"PA",shift:S.shift==="all"?"1st":S.shift,area:""};
  const dis=S.canWrite?"":"disabled";
  const form=`<div class="form">
    <label>Name<input id="f_name" value="${esc(v.name)}" ${dis} autocomplete="off"></label>
    <label>Employee ID<input id="f_emp" value="${esc(v.empId)}" ${dis} autocomplete="off"></label>
    <label>Role<select id="f_role" ${dis}>${ROLES.map(([c,n])=>`<option value="${c}" ${v.role===c?"selected":""}>${n}</option>`).join("")}</select></label>
    <label>Shift<select id="f_shift" ${dis}>${SHIFTS.map(s=>`<option ${v.shift===s?"selected":""}>${s}</option>`).join("")}</select></label>
    <label>Line / area<input id="f_area" value="${esc(v.area)}" ${dis} autocomplete="off"></label></div>`;
  let body;
  if(drawer.mode==="new"){
    body=`${form}<div style="display:flex;gap:10px"><button class="btn primary" data-act="create">Add and rate skills</button><button class="btn" data-act="close">Cancel</button></div>`;
  }else{
    const st=stats(p);
    const groups=CATS.map(([cat,code,items])=>{
      const rows=items.filter(s=>!S.onlyRole||rq(p,s[0])>0);
      if(!rows.length)return "";
      const g=rows.filter(s=>lv(p,s[0])<rq(p,s[0])).length;
      return `<div class="cat-h">${esc(cat)}<span>${g?`<b style="color:var(--gap)">${g} gap${g===1?"":"s"}</b>`:"All met"}</span></div>`+rows.map(s=>{const id=s[0],cur=lv(p,id),r=rq(p,id);const cls=r>0?(cur>=r?"is-ok":"is-gap"):"";
        return `<div class="er ${cls}" id="row-${id}"><div><div class="n">${esc(s[1])}</div><div class="m"><span>${id}</span>${r>0?`<span class="need">Needs ${r}</span>`:"<span>Not needed for role</span>"}${r>0&&cur<r?`<span class="g">Gap</span>`:""}</div></div>
        <div class="lvls" role="group" aria-label="${esc(s[1])} level">${[0,1,2,3,4].map(n=>`<button class="b${n} ${n===r?"req":""}" data-set="${id}" data-lv="${n}" aria-pressed="${cur===n}" title="${LEVELS[n][1]}" ${dis}>${n}</button>`).join("")}</div></div>`}).join("");
    }).join("");
    body=`<details class="help" ${p.name?"":"open"}><summary>Edit details (name, role, shift)</summary><div style="margin-top:10px;display:grid;gap:10px">${form}
      ${S.canWrite?`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="saveinfo">Save details</button><button class="btn danger ${S.armed===p.id?"armed":""}" data-act="delete">${S.armed===p.id?"Tap again to remove "+esc(p.name):"Remove from team"}</button></div>`:""}</div></details>
      <div class="legend">${LEVELS.map(([l,n])=>`<span><i class="lv${l}">${l}</i>${n}</span>`).join("")}</div>
      <div class="seg" role="group" aria-label="Which skills"><button data-only="1" aria-pressed="${S.onlyRole}">Skills for this role (${st.need})</button><button data-only="0" aria-pressed="${!S.onlyRole}">All skills (${SKILLS.length})</button></div>
      ${groups}`;
  }
  const st=p?stats(p):null;
  host.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${p?esc(p.name):"Add team member"}">
    <div class="dh"><div class="row"><h2>${p?esc(p.name):"Add team member"}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    ${p?`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span style="color:var(--muted)">${esc(ROLE_NAME[p.role]||"")} · ${esc(p.shift)} shift${p.area?" · "+esc(p.area):""}</span><span style="margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:20px;color:${tone(st.pct)}">${st.pct}% ready</span>${st.gaps.length?`<span class="pill risk">${st.gaps.length} gap${st.gaps.length===1?"":"s"}</span>`:`<span class="pill ok">Fully qualified</span>`}</div><div class="meter"><i style="width:${st.pct}%;background:${tone(st.pct)}"></i></div>`:""}</div>
    <div class="db">${body}</div></aside>`;
  if(keepScroll)host.querySelector(".db").scrollTop=prevScroll;
}

/* ======================= persistence ======================= */
const queues=new Map();
function enqueue(id,fn){const prev=queues.get(id)||Promise.resolve();const next=prev.then(fn,fn);queues.set(id,next.catch(()=>{}));return next}
function saveLocal(){try{localStorage.setItem("fls_people",JSON.stringify(S.people))}catch(e){}}
function writeErr(e){
  if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("You don't have edit access here");render();renderDrawer(true);return}
  if(e&&e.code==="quota_exceeded"){toast("Storage is full. Remove someone first.");return}
  toast("Couldn't save. Check your connection and try again.");
}
async function setLevel(pid,id,n){
  const p=S.people.find(x=>x.id===pid);if(!p||lv(p,id)===n)return;
  p.levels={...(p.levels||{}),[id]:n};
  render();renderDrawer(true);
  if(S.mode==="live")enqueue(pid,()=>col.doc(pid).update({levels:{[id]:n},updated:new Date().toISOString()})).catch(writeErr);
  else if(S.mode==="local")saveLocal();
}
function readForm(){
  const g=id=>document.getElementById(id).value.trim();
  return{name:g("f_name"),empId:g("f_emp"),role:g("f_role"),shift:g("f_shift"),area:g("f_area")};
}
async function createPerson(){
  const f=readForm();if(!f.name){toast("Enter a name first");document.getElementById("f_name").focus();return}
  const person={...f,levels:{},updated:new Date().toISOString()};
  if((S.mode==="sample"&&col)||S.mode==="live"||(S.mode==="sample"&&!col)){
    if(!col){S.mode="local";S.people=[];return createPerson()}
    const ref=col.doc();
    if(S.mode==="sample"){S.mode="live";S.people=[]}
    S.people.push({id:ref.id,...person});drawer={mode:"edit",id:ref.id};render();renderDrawer();
    enqueue(ref.id,()=>ref.set(person)).then(()=>toast("Added "+f.name)).catch(writeErr);
  }else{const id="p"+Date.now();S.people.push({id,...person});saveLocal();drawer={mode:"edit",id};render();renderDrawer();toast("Added "+f.name)}
}
function saveInfo(){
  const p=S.people.find(x=>x.id===drawer.id);const f=readForm();if(!f.name){toast("Name can't be empty");return}
  Object.assign(p,f);render();renderDrawer(true);toast("Details saved");
  if(S.mode==="live")enqueue(p.id,()=>col.doc(p.id).update({...f,updated:new Date().toISOString()})).catch(writeErr);
  else if(S.mode==="local")saveLocal();
}
function removePerson(){
  const p=S.people.find(x=>x.id===drawer.id);
  if(S.armed!==p.id){S.armed=p.id;renderDrawer(true);return}
  S.people=S.people.filter(x=>x.id!==p.id);S.armed=null;closeDrawer();render();toast("Removed "+p.name);
  if(S.mode==="live")enqueue(p.id,()=>col.doc(p.id).delete()).catch(writeErr);
  else if(S.mode==="local")saveLocal();
}
async function exportCsv(){
  const rows=[["Emp ID","Name","Role","Shift","Line/Area","% Ready","Gaps",...SKILLS.map(s=>s.id+" "+s.name)]];
  visiblePeople().forEach(p=>{const st=stats(p);rows.push([p.empId||"",p.name,ROLE_NAME[p.role]||"",p.shift,p.area||"",st.pct+"%",st.gaps.length,...SKILLS.map(s=>lv(p,s.id))])});
  const csv=rows.map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")).join("\r\n");
  try{await dl.save({filename:"frozen-line-skill-matrix.csv",data:"﻿"+csv});toast("Exported")}catch(e){if(e&&e.code!=="declined")toast("Export isn't available here")}
}

/* ======================= render & events ======================= */
function render(){
  renderHeader();
  const v={dashboard:viewDashboard,team:viewTeam,skills:viewSkills,training:viewTraining,guide:viewGuide}[S.view]||viewDashboard;
  const main=document.getElementById("main");
  const focusId=document.activeElement&&document.activeElement.id;const caret=focusId==="q"?document.activeElement.selectionStart:null;
  main.innerHTML=banner()+v();
  if(focusId==="q"){const q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(caret,caret)}catch(e){}}}
}
function go(view){if(S.view!==view){S.view=view;S.q="";S.open=null}if(location.hash!=="#"+view)history.replaceState(null,"","#"+view);render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-shift],[data-view],[data-person],[data-skill],[data-act],[data-tv],[data-set],[data-only],[data-tb]");if(!t)return;
  const d=t.dataset;
  if(d.shift){S.shift=d.shift;render();return}
  if(d.view){go(d.view);return}
  if(d.set){if(S.canWrite&&drawer)setLevel(drawer.id,d.set,+d.lv);return}
  if(d.person){openPerson(d.person);return}
  if(d.skill){S.open=d.skill;go("skills");requestAnimationFrame(()=>{const el=document.querySelector(`[data-sk="${d.skill}"]`);el&&el.scrollIntoView({block:"center"})});return}
  if(d.tv){S.teamView=d.tv;render();return}
  if(d.tb){S.trainBy=d.tb;render();return}
  if(d.only){S.onlyRole=d.only==="1";renderDrawer();return}
  if(d.act==="add"){openNew();return}
  if(d.act==="close"){closeDrawer();return}
  if(d.act==="create"){createPerson();return}
  if(d.act==="saveinfo"){saveInfo();return}
  if(d.act==="delete"){removePerson();return}
  if(d.act==="export"){exportCsv();return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render()}});
document.addEventListener("change",e=>{if(e.target.id==="roleF"){S.role=e.target.value;render()}if(e.target.id==="catF"){S.cat=e.target.value;render()}});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details.sk")&&e.target.open)S.open=e.target.dataset.sk},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer)closeDrawer()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["dashboard","team","skills","training","guide"].includes(h)&&h!==S.view){S.view=h;render()}});

/* ======================= boot ======================= */
(function(){const h=location.hash.slice(1);if(["dashboard","team","skills","training","guide"].includes(h))S.view=h})();
S.people=sampleTeam();S.mode="sample";render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){fallbackLocal();return}
  const [dbNs,userNs,dlNs]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  dl=dlNs;
  if(!dbNs){fallbackLocal();return}
  db=dbNs;col=db.collection("people");
  if(userNs&&userNs.can){try{const w=await userNs.can("data.write");if(w===false)S.canWrite=false}catch(e){}}
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(docs.length){S.mode="live";S.people=docs.map(x=>({...x,levels:{...(x.levels||{})}}))}
    else if(S.mode==="live")S.people=[];render();if(drawer)renderDrawer(true);
  },err=>{clearTimeout(timer);S.stale=false;if(err.code==="revoked"){S.canWrite=false}else toast("Saved data is unavailable right now");render()});
})();
function fallbackLocal(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem("fls_people")||"null")}catch(e){}
  if(Array.isArray(saved)&&saved.length){S.people=saved;S.mode="local"}else{S.mode="sample"}
  render();
}
</script>
